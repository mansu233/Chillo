<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2BB5E8"><meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Chillo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&display=swap" rel="stylesheet">
<script>try{document.documentElement.style.setProperty('--fs',localStorage.getItem('chillo_fs')||'1')}catch(e){}</script>
<style>
:root{--blue:#2BB5E8;--blue2:#1B8FBF;--ink:#0F3B52;--pink:#FF7BAC;--bg:#EAF7FD;--bg2:#F8FCFE;--card:#FFFFFF;--input:#F4FAFD;--line:#D8EAF2;--bad:#C0392B;--shadow:0 6px 20px rgba(15,59,82,.08)}
@media (prefers-color-scheme:dark){:root{--ink:#E6F3F9;--bg:#0A1A24;--bg2:#0E2331;--card:#12303F;--input:#0E2735;--line:#24485A;--shadow:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs,1))}
body{margin:0;font:1rem/1.45 Cairo,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;min-height:100vh}
header{background:linear-gradient(135deg,#1B9CD6,#4FC6F2);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.375rem;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(27,143,191,.35)}
main{padding:16px;max-width:520px;margin:0 auto 100px}
main section{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero{text-align:center;padding-top:56px}.hero input{text-align:left}
.hidden{display:none!important}
h1{font-size:1.875rem;margin:6px 0}h2{font-size:1.375rem;margin:0 0 12px}
h3{font-size:.8125rem;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue2)}
input,select,button{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--input);color:var(--ink);margin:4px 0 12px;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,181,232,.2)}
button{background:linear-gradient(135deg,#2BB5E8,#1B8FBF);color:#fff;border:0;font-weight:700;box-shadow:0 4px 12px rgba(27,143,191,.3)}
button:active{transform:scale(.98)}
button.alt{background:var(--card);color:var(--blue2);border:1.5px solid var(--blue);box-shadow:none}
#cdel,#pdel,#odel,#rclr{color:var(--bad);border-color:#E9B4AD}
label{font-size:.8125rem;font-weight:700;opacity:.85}
.big{font-size:2.625rem;font-weight:800;margin:2px 0 10px;background:linear-gradient(90deg,var(--ink),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF7BAC,#FFA46B);border-radius:6px}
.muted{opacity:.65;font-size:.875rem}.err{color:var(--bad);font-size:.875rem;min-height:18px}
a{color:var(--blue2);background:rgba(43,181,232,.12);padding:4px 11px;border-radius:999px;font-size:.8125rem;font-weight:700;margin-left:8px;cursor:pointer;white-space:nowrap}
input[type=checkbox]{width:24px;height:24px;margin:0;flex:none;accent-color:#1B8FBF}
details summary{cursor:pointer;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 18px rgba(15,59,82,.08)}
nav::-webkit-scrollbar{display:none}
nav button{margin:0;border-radius:0;background:none;box-shadow:none;color:var(--ink);opacity:.55;flex:1 0 auto;width:auto;min-width:72px;white-space:nowrap;font-size:.6875rem;font-weight:600;padding:9px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{opacity:1;color:var(--blue2);box-shadow:inset 0 3px 0 var(--pink)}
</style></head><body>

<div id="login" class="hidden"><main class="hero">
<img src="icon.svg" width="72" height="72" alt=""><h1 style="margin:8px 0 0">Chillo <small class="ver muted" style="font-size:13px;font-weight:400"></small></h1><p class="muted">Sign in to log your sales.</p>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" inputmode="numeric" autocomplete="current-password">
<div class="err" id="lerr"></div><button id="go">Sign in</button></main></div>

<div id="wait" class="hidden"><main><h1>Waiting for admin access</h1>
<p>Your account has no access yet. Ask your admin to switch it on.</p>
<button class="alt" id="out">Sign out</button></main></div>

<div id="app" class="hidden">
<header><span style="display:flex;align-items:center;gap:8px"><img src="icon.svg" width="30" height="30" alt="">Chillo <small class="ver" style="font-size:12px;font-weight:400;opacity:.85"></small></span><span id="who" style="font-size:14px;font-weight:500"></span></header>
<main>
<section id="home"></section>
<section id="add" class="hidden"><h2>Daily sale</h2>
<label>Date</label><input id="date" type="date">
<label>Total sale (cash collected, SAR)</label><input id="amt" type="number" inputmode="decimal">
<label>Area</label><select id="area"></select>
<label>Note (optional)</label><input id="note">
<div class="err" id="aerr"></div><button id="save">Save sale</button></section>
<section id="mem" class="hidden"></section>
<section id="prod" class="hidden"></section>
<section id="cust" class="hidden"></section>
<section id="stock" class="hidden"></section>
<section id="lsetup" class="hidden"></section>
<section id="rem" class="hidden"></section>
<section id="set" class="hidden"><h2>Settings</h2>
<div id="tgbox"><label>Monthly target (SAR)</label><input id="tg" type="number" inputmode="decimal">
<button id="stg" class="alt">Save target</button></div>
<div id="arbox"><label>My areas</label><div id="arl"></div>
<input id="na" placeholder="New area, for example Jeddah"><button id="aa" class="alt">Add area</button></div>
<label>New 6-digit password</label><input id="np" type="password" inputmode="numeric" maxlength="6">
<div class="err" id="pmsg"></div><button id="cp" class="alt">Change password</button>
<label>Text size</label><select id="fsz"><option value="0.9">Small</option><option value="1">Normal</option><option value="1.12">Large</option><option value="1.25">Extra large</option></select>
<p class="muted">Chillo <span class="ver"></span></p><button id="out2">Sign out</button></section>
</main>
<nav><button data-t="home" class="on">Month</button><button data-t="add">Add sale</button><button data-t="set">Settings</button><button data-t="mem" id="tmem" class="hidden">Members</button><button data-t="prod" id="tprod" class="hidden">Products</button><button data-t="cust" id="tcust" class="hidden">Customers</button><button data-t="stock" id="tstock" class="hidden">Stock</button><button data-t="lsetup" id="tlsetup" class="hidden">Load setup</button><button data-t="rem" id="trem" class="hidden">Reminders</button></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// 1) Paste your Firebase web app config here (Project settings > Your apps)
const CFG={apiKey:"AIzaSyCqCsueTJSETiVjbFE7VdNyPXUZGRMKNqU",authDomain:"chillo-765ef.firebaseapp.com",projectId:"chillo-765ef",storageBucket:"chillo-765ef.firebasestorage.app",messagingSenderId:"1062690319679",appId:"1:1062690319679:web:90dfbe472054dd8f13f78a"};

const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:0});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,uid=null,entries=[],editId=null,unsub=null;

firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const userDoc=()=>db.collection('users').doc(uid);
const sales=()=>userDoc().collection('sales');

function show(id){['login','wait','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function tab(t){
  ['home','add','set','mem','prod','cust','stock','lsetup','rem'].forEach(x=>$(x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='lsetup')drawSetup();
  if(t==='rem')drawRems();
}
function reset(){editId=null;$('amt').value='';$('note').value='';$('aerr').textContent='';$('date').value=ymd(new Date());$('save').textContent='Save sale'}

auth.onAuthStateChanged(async u=>{
  if(!u){show('login');return}
  uid=u.uid;
  try{const s=await userDoc().get();me=s.exists?s.data():null}catch(e){me=null}
  const any=me&&(me.role==='admin'||Object.values(me.perms||{}).some(Boolean));
  if(!me||me.active===false||!any){show('wait');return}
  me.areas=me.areas||[];
  show('app');$('who').textContent=me.name||u.email;start();
});

$('go').onclick=async()=>{
  $('lerr').textContent='';
  try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}
  catch(e){
    const bad=['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(e.code);
    $('lerr').textContent=(bad?'Wrong email or password.':'Sign-in problem.')+' ('+e.code+')';
  }
};
$('out').onclick=$('out2').onclick=()=>auth.signOut();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.t!=='add')reset();tab(b.dataset.t)});

function start(){
  const n=new Date(),a=ymd(new Date(n.getFullYear(),n.getMonth(),1)),b=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  unsub&&unsub();
  unsub=sales().where('date','>=',a).where('date','<=',b).orderBy('date','desc')
    .onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  reset();$('tg').value=me.target||'';fillAreas();applyAccess();if(me.role==='admin')watchMembers();if(can('prod.view')||can('stock.use')||can('load.setup'))watchProducts();if(can('cust.view'))watchCusts();if(can('rem.use'))watchRems();if(can('stock.use')||can('load.setup'))loadStock();
}

function render(){
  if(!can('sales.report')){$('home').innerHTML='<p class="muted">No access to the monthly report.</p>';return}
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate();
  let work=0,done=0;
  for(let d=1;d<=dim;d++){ if(new Date(y,m,d).getDay()!==5){work++;if(d<=n.getDate())done++} } // Friday = holiday
  const left=work-done,elapsed=Math.max(done,1);
  const total=entries.reduce((s,e)=>s+e.amount,0),avg=total/elapsed,proj=avg*work;
  const target=me.target||0,pct=target?Math.round(total/target*100):0;
  const need=target&&left>0?Math.max(0,(target-total)/left):0;
  const byArea={};entries.forEach(e=>{const k=e.area||'No area';byArea[k]=(byArea[k]||0)+e.amount});
  $('home').innerHTML=
   `${dueHtml()}<div class="muted">${n.toLocaleString('en',{month:'long',year:'numeric'})}</div>
    <div class="big">${fmt(total)} SAR</div>
    <div class="row"><span>Daily average</span><b>${fmt(avg)}</b></div>
    <div class="row"><span>Expected month-end</span><b>${fmt(proj)}</b></div>
    <div class="row"><span>Working days left</span><b>${left}</b></div>`+
   (target?`<div class="row"><span>Target ${fmt(target)}</span><b>${pct}%</b></div>
    <div class="bar"><i style="width:${Math.min(pct,100)}%"></i></div>
    <div class="muted">Need ${fmt(need)} per working day to reach it</div>`:'')+
   `<h3>By area</h3>`+(Object.keys(byArea).map(k=>`<div class="row"><span>${esc(k)}</span><b>${fmt(byArea[k])}</b></div>`).join('')||'<div class="muted">No sales yet this month.</div>')+
   `<h3>Entries</h3>`+entries.map(e=>`<div class="row"><span>${e.date}<br><span class="muted">${esc(e.area||'No area')}${e.note?', '+esc(e.note):''}</span></span>
    <span><b>${fmt(e.amount)}</b>${can('sales.edit')?'<a data-e="'+e.id+'">Edit</a>':''}${can('sales.delete')?'<a data-d="'+e.id+'">Delete</a>':''}</span></div>`).join('');
}
$('home').onclick=ev=>{
  const t=ev.target,e=entries.find(x=>x.id===t.dataset.e);
  if(e){editId=e.id;$('date').value=e.date;$('amt').value=e.amount;$('area').value=e.area||'';$('note').value=e.note||'';$('save').textContent='Update sale';tab('add')}
  if(t.dataset.d&&confirm('Delete this sale entry?'))sales().doc(t.dataset.d).delete().catch(x=>alert(x.message));
};

$('save').onclick=()=>{
  const amount=parseFloat($('amt').value),date=$('date').value;
  if(!date||$('amt').value===''||!(amount>=0)){$('aerr').textContent='Enter the date and the amount.';return}
  const data={date,amount,area:$('area').value,note:$('note').value.trim()};
  (editId?sales().doc(editId).update(data):sales().add({...data,ts:firebase.firestore.FieldValue.serverTimestamp()}))
    .catch(x=>alert('Could not save: '+x.message));
  reset();tab('home');
};

function fillAreas(){
  $('area').innerHTML=me.areas.length?me.areas.map(a=>`<option>${esc(a)}</option>`).join(''):'<option value="">Add areas in Settings</option>';
  $('arl').innerHTML=me.areas.map((a,i)=>`<div class="row"><span>${esc(a)}<br><span class="muted">${cs.filter(c=>c.area===a).length} customers</span></span><span><a data-au="${i}">&uarr;</a><a data-ad="${i}">&darr;</a><a data-ar="${i}">Rename</a><a data-r="${i}">Remove</a></span></div>`).join('')||'<div class="muted">No areas yet.</div>';
}
const saveAreas=()=>{userDoc().update({areas:me.areas}).catch(x=>alert(x.message));fillAreas()};
$('aa').onclick=()=>{const v=$('na').value.trim();if(v&&!me.areas.includes(v)){me.areas.push(v);$('na').value='';saveAreas()}};
$('arl').onclick=e=>{
  const d=e.target.dataset,A=me.areas;
  if(d.au!==undefined){const i=+d.au;if(i>0){[A[i-1],A[i]]=[A[i],A[i-1]];saveAreas()}}
  else if(d.ad!==undefined){const i=+d.ad;if(i<A.length-1){[A[i+1],A[i]]=[A[i],A[i+1]];saveAreas()}}
  else if(d.ar!==undefined){
    const i=+d.ar,old=A[i],nw=(prompt('New name for '+old,old)||'').trim();
    if(nw&&nw!==old&&!A.includes(nw)){A[i]=nw;saveAreas();const b=db.batch();cs.filter(c=>c.area===old).forEach(c=>b.update(custs().doc(c.id),{area:nw}));b.commit().catch(()=>{})}
  }
  else if(d.r!==undefined){
    const a=A[+d.r],n=cs.filter(c=>c.area===a).length;
    if(confirm('Remove "'+a+'"?'+(n?' '+n+' customers use it and keep the name.':''))){A.splice(+d.r,1);saveAreas()}
  }
};
$('na').onkeydown=e=>{if(e.key==='Enter')$('aa').click()};
$('stg').onclick=()=>{me.target=parseFloat($('tg').value)||0;userDoc().update({target:me.target}).catch(x=>alert(x.message));render();tab('home')};

$('cp').onclick=async()=>{
  const p=$('np').value,easy=/^(\d)\1+$/.test(p)||['123456','654321','012345','123123','112233','121212','123321','234567','345678','456789','567890','987654'].includes(p);
  if(!/^\d{6}$/.test(p)){$('pmsg').textContent='Use exactly 6 digits.';return}
  if(easy){$('pmsg').textContent='Avoid easy codes like 123456 or 000000.';return}
  try{await auth.currentUser.updatePassword(p);$('pmsg').textContent='Password changed.';$('np').value=''}
  catch(e){$('pmsg').textContent='Sign out, sign in again, then retry.'}
};

const PERMS={
 'Sales':[['sales.add','Add daily sales'],['sales.edit','Edit sale entries'],['sales.delete','Delete sale entries'],['sales.report','See monthly report']],
 'Products':[['prod.view','View products'],['prod.price','View prices']],
 'Customers':[['cust.view','View customers and mark visits'],['cust.add','Add customers'],['cust.edit','Edit customers'],['cust.delete','Delete customers'],['cust.photo','Shop photo and freezer records']],
 'Routes and reminders':[['route.use','Create routes'],['rem.use','Reminders']],
 'Credit ledger':[['led.view','View customer credit'],['led.add','Give credit and record payments'],['led.edit','Delete credit entries']],
 'Stock and orders':[['stock.use','Upload stock, make order, morning check, saved orders'],['load.setup','Own load limits and doors']],
 'Settings':[['set.target','Set own monthly target'],['set.areas','Manage own areas']]};
const can=k=>me.role==='admin'||!!(me.perms&&me.perms[k]);
let members=[],openId=null;

function applyAccess(){
  document.querySelector('[data-t=add]').classList.toggle('hidden',!can('sales.add'));
  $('tmem').classList.toggle('hidden',me.role!=='admin');
  $('tprod').classList.toggle('hidden',!can('prod.view'));
  $('tcust').classList.toggle('hidden',!can('cust.view'));
  $('tstock').classList.toggle('hidden',!can('stock.use'));
  $('tlsetup').classList.toggle('hidden',!can('load.setup'));
  $('trem').classList.toggle('hidden',!can('rem.use'));
  $('tgbox').classList.toggle('hidden',!can('set.target'));
  $('arbox').classList.toggle('hidden',!can('set.areas'));
}
function weakMsg(p){
  if(!/^\d{6}$/.test(p))return 'Use exactly 6 digits.';
  if(/^(\d)\1+$/.test(p)||['123456','654321','012345','123123','112233','121212','123321','234567','345678','456789','567890','987654'].includes(p))return 'Avoid easy codes like 123456 or 000000.';
  return '';
}
function watchMembers(){
  db.collection('users').onSnapshot(s=>{members=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.id!==uid);if(!openId)drawMembers()});
}
function drawMembers(){
  const m=members.find(x=>x.id===openId);
  if(m){
    const p=m.perms||{};
    $('mem').innerHTML=`<a id="back" style="margin:0">Back to members</a><h2>${esc(m.name)}</h2>
    <div class="muted">${esc(m.email||'')}<br>${esc(m.branch||'No branch')}</div>
    <div class="row"><label for="act">Account active</label><input id="act" type="checkbox" ${m.active!==false?'checked':''}></div>`+
    Object.keys(PERMS).map(c=>`<h3>${c}</h3>`+PERMS[c].map(([k,t])=>`<div class="row"><label for="p_${k}">${t}</label><input id="p_${k}" data-k="${k}" type="checkbox" ${p[k]?'checked':''}></div>`).join('')).join('')+
    `<p><button id="pall" class="alt">Switch all on</button><button id="pnone" class="alt">Switch all off</button></p>
    <div class="err" id="mmsg"></div><button id="msave">Save</button><button id="mreset" class="alt">Send password reset email</button><button id="mord" class="alt">View orders</button>`;
    return;
  }
  $('mem').innerHTML=`<h2>Add member</h2>
  <label>Name</label><input id="mname"><label>Email</label><input id="memail" type="email">
  <label>Branch</label><input id="mbranch"><label>Starting 6-digit password</label><input id="mpass" type="password" inputmode="numeric" maxlength="6">
  <div class="err" id="amsg"></div><button id="addm">Create member</button>
  <h2>Members</h2>`+(members.map(m=>`<div class="row"><span>${esc(m.name)}<br><span class="muted">${esc(m.branch||'No branch')}${m.active===false?', inactive':''}</span></span><a data-m="${m.id}">Manage</a></div>`).join('')||'<div class="muted">No members yet.</div>');
}
async function addMember(){
  const name=$('mname').value.trim(),email=$('memail').value.trim(),branch=$('mbranch').value.trim(),pw=$('mpass').value,msg=$('amsg');
  if(!name||!email){msg.textContent='Enter the name and email.';return}
  if(weakMsg(pw)){msg.textContent=weakMsg(pw);return}
  msg.textContent='Creating...';let sec;
  try{
    sec=firebase.initializeApp(CFG,'sec'+Date.now());
    const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
    await db.collection('users').doc(c.user.uid).set({name,email,branch,role:'sales',active:true,perms:{}});
    ['mname','memail','mbranch','mpass'].forEach(i=>$(i).value='');
    msg.textContent='Member created. Tap Manage to switch on their permissions.';
  }catch(e){msg.textContent='Could not create: '+(e.code||e.message)}
  finally{sec&&sec.delete()}
}
$('mem').onclick=async ev=>{
  const t=ev.target;
  if(t.id==='addm')return addMember();
  if(t.id==='mord')return showMemberOrders();
  ordActions(t,openId,showMemberOrders);
  if(t.dataset.m){openId=t.dataset.m;drawMembers();return}
  if(t.id==='back'){openId=null;drawMembers();return}
  if(t.id==='pall'||t.id==='pnone'){document.querySelectorAll('#mem [data-k]').forEach(c=>c.checked=t.id==='pall');return}
  if(t.id==='msave'){
    const perms={};document.querySelectorAll('#mem [data-k]').forEach(c=>perms[c.dataset.k]=c.checked);
    db.collection('users').doc(openId).update({active:$('act').checked,perms}).then(()=>$('mmsg').textContent='Saved.').catch(e=>$('mmsg').textContent=e.message);
  }
  if(t.id==='mreset'){
    const m=members.find(x=>x.id===openId);

async function importFile(f){
  const msg=$('pmsg2');msg.textContent='Reading file...';
  try{
    const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    let ok=0,skip=0,n=0,batch=db.batch();
    for(const r of rows){
      const k={};Object.keys(r).forEach(h=>k[String(h).trim().toLowerCase()]=r[h]);
      const code=String(k.code||'').trim(),name=String(k.name||'').trim();
      if(!code||!name){skip++;continue}
      const pr=parseFloat(k.price);
      batch.set(db.collection('products').doc(idOf(code)),{code,name,pack:String(k.pack||'').trim(),unit:String(k.unit||'Carton').trim(),category:String(k.category||'').trim(),price:isNaN(pr)?null:pr},{merge:true});
      ok++;n++;
      if(n===400){await batch.commit();batch=db.batch();n=0}
    }
    if(n)await batch.commit();
    msg.textContent='Imported '+ok+' products'+(skip?', skipped '+skip+' rows without code or name':'')+'.';
  }catch(e){msg.textContent='Import failed: '+e.message}
}

function editPhoto(file,cb){
  const img=new Image(),W=320,H=240;
  img.onload=()=>{
    let rot=0,z=1,ox=0,oy=0,d0=0,z0=1;const pts=new Map();
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
    ov.innerHTML='<canvas width="320" height="240" style="touch-action:none;background:#000"></canvas><div style="color:#fff;font-size:14px">Drag to move, pinch or use the slider to zoom</div><input type="range" min="1" max="4" step="0.05" value="1" style="width:320px"><div style="display:flex;gap:8px;width:320px"><button class="alt" id="er">Rotate</button><button class="alt" id="ec">Cancel</button><button id="es">Use photo</button></div>';

    const base=()=>{const w=rot%2?img.height:img.width,h=rot%2?img.width:img.height;return Math.max(W/w,H/h)};
    const draw=(c,k)=>{c.fillStyle='#000';c.fillRect(0,0,W*k,H*k);c.save();c.translate(W*k/2+ox*k,H*k/2+oy*k);c.rotate(rot*Math.PI/2);const sc=base()*z*k;c.scale(sc,sc);c.drawImage(img,-img.width/2,-img.height/2);c.restore()};
    const paint=()=>draw(ctx,1);paint();
    const dd=()=>{const[a,b]=[...pts.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};

function parseStock(text){
  const rows=[],seen={};let cur=null;
  const fin=()=>{
    if(!cur)return;const m=cur.rest.match(/(\d{4})/)||cur.first.match(/-\s?(\d{4})\b/);if(!m)return;
    const key=(/FG[-\s]*SA/i.test(cur.first)?'SA':'ICE')+m[1];if(seen[key])return;seen[key]=1;
    const name=(cur.first.replace(/^FG[-\s]*(ICE|SA)?\s*/i,'')+' '+cur.rest.replace(/^\s*[A-Z]?\s*-?\s*\d{4}\s*/,'')).replace(/\s+/g,' ').trim();
    const cm=cur.rest.match(/^\s*([A-Z]?)\s*-?\s*(\d{4})/),pre=key.startsWith('SA')?'SA':'ICE';
    rows.push({key,code:'FG-'+pre+(pre==='SA'&&cm&&cm[1]?cm[1]:'')+'-'+m[1],name,orig:cur.orig,rem:cur.rem});
  };
  for(const l of text.split('\n').map(x=>x.trim()).filter(Boolean)){
    const m=l.match(/(\d{1,5}[.,]\d{3})\s+(\d{1,5}[.,]\d{3})\s*$/);
    if(m){fin();cur={first:l.slice(0,m.index).replace(/\bCarton\b/i,'').trim(),rest:'',orig:+m[1].replace(',','.'),rem:+m[2].replace(',','.')}}
    else if(cur)cur.rest+=' '+l;
  }
  fin();return rows;
}
const keyOf=c=>{const d=(String(c).match(/(\d{4})\s*$/)||[])[1];return d?((/^FG[-\s]*SA/i.test(c)?'SA':'ICE')+d):null};

}
function offerNew(rows){

function calcNeed(rem,c){
  let n=Math.max(0,c.max-rem);const k=c.step||0;
  if(k>0){const q=n/k;n=(st.opts.dir==='up'?Math.ceil(q):st.opts.dir==='near'?Math.round(q):Math.floor(q))*k}
  return n;
}

async function ocr(file,say){
  const img=await createImageBitmap(file),W=img.width,H=img.height,S=1500,O=120,txt=[];
  say('Loading the reader (needs internet the first time)...');
  const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_pageseg_mode:'6'});
  for(let y=0,i=1;y<H;y+=S-O,i++){
    const h=Math.min(S,H-y),c=document.createElement('canvas');c.width=W;c.height=h;const cx=c.getContext('2d');cx.drawImage(img,0,y,W,h,0,0,W,h);const id=cx.getImageData(0,0,W,h),a=id.data;for(let j=0;j<a.length;j+=4){const g=.3*a[j]+.59*a[j+1]+.11*a[j+2],v=g<125?0:255;a[j]=a[j+1]=a[j+2]=v}cx.putImageData(id,0,0);
    say('Reading part '+i+'...');txt.push((await w.recognize(c)).data.text);if(y+h>=H)break;
  }
  await w.terminate();return parseStock(txt.join('\n'));
}

function drawOrder(){
  const rows=st.rows.filter(r=>st.cfg[r.key]&&st.cfg[r.key].max>0),no=st.rows.length-rows.length;
  rows.sort((a,b)=>(st.cfg[a.key].door??9)-(st.cfg[b.key].door??9));let last='',h='';
  rows.forEach(r=>{const c=st.cfg[r.key],d=c.door===''||c.door==null?'No door':st.doors[c.door];
    if(d!==last){h+=`<h3>${esc(d)}</h3>`;last=d}
    h+=`<div class="row"><span>${esc(r.name)}<br><span class="muted">Remaining ${r.rem}, max ${c.max}${c.step?', round '+c.step:''}</span></span><input data-o="${r.key}" data-n="${esc(r.name)}" data-d="${d}" type="number" step="any" value="${calcNeed(r.rem,c)}" data-rem="${r.rem}" style="width:80px;margin:0"></div>`});
  $('sb').innerHTML=`<p class="muted">Order = max load minus remaining. Change any quantity you want.${no?' '+no+' products have no max set (see Load setup).':''}</p>${h||'<p>No products have a max load yet. Set them in Load setup.</p>'}<p></p><button id="osave">Save order</button><button id="orb" class="alt">Rebuild automatically</button><button id="oshare" class="alt">Share on WhatsApp</button>`;
}
function compare(m){
  const nm={},od={};((st.night&&st.night.rows)||[]).forEach(r=>nm[r.key]=r);((st.order&&st.order.rows)||[]).forEach(r=>od[r.key]=r.qty);
  let ok=0,bad=0;
  const h=m.map(r=>{const n=nm[r.key],ld=r.orig-(n?n.rem:0),o=od[r.key]||0,df=ld-o,good=Math.abs(df)<0.0005;good?ok++:bad++;
    return `<div class="row"><span>${esc(r.name)}<br><span class="muted">Ordered ${o}, loaded ${ld}${n?'':' (new product)'}</span></span><b style="color:${good?'#1E8E4E':'#C0392B'}">${good?'OK':df>0?'Excess +'+df:'Short '+df}</b></div>`}).join('');
  return `<h3>${ok} OK, ${bad} to check</h3>`+h;
}
function pickShot(){
