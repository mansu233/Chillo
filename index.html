<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2BB5E8">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Chillo</title>
<style>
:root{--blue:#2BB5E8;--ink:#0F3B52;--pink:#FF7BAC;--bg:#F2F9FC;--line:#D3E8F0;--bad:#C0392B}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--blue);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:22px}
main{padding:16px;max-width:520px;margin:0 auto 90px}
.hidden{display:none!important}
input,select,button{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin:4px 0 12px}
button{background:var(--ink);color:#fff;border:0;font-weight:600}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
label{font-size:14px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{margin:0;border-radius:0;background:none;color:var(--ink);opacity:.6;padding:14px 4px}
nav{overflow-x:auto}
nav button{font-size:14px;flex:1 0 auto;width:auto;white-space:nowrap;padding:14px 12px}
nav::-webkit-scrollbar{display:none}
nav button.on{opacity:1;box-shadow:inset 0 3px 0 var(--pink)}
.big{font-size:40px;font-weight:700;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pink)}
.muted{opacity:.65;font-size:14px}.err{color:var(--bad);font-size:14px;min-height:18px}
input[type=checkbox]{width:24px;height:24px;margin:0;flex:none}
a{color:var(--blue);font-weight:600;margin-left:10px;cursor:pointer}
</style></head><body>

<div id="login" class="hidden"><main>
<h1>Chillo</h1><p class="muted">Sign in to log your sales.</p>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" inputmode="numeric" autocomplete="current-password">
<div class="err" id="lerr"></div><button id="go">Sign in</button></main></div>

<div id="wait" class="hidden"><main><h1>Waiting for admin access</h1>
<p>Your account has no access yet. Ask your admin to switch it on.</p>
<button class="alt" id="out">Sign out</button></main></div>

<div id="app" class="hidden">
<header><span>Chillo</span><span id="who" style="font-size:14px;font-weight:500"></span></header>
<main>
<section id="home"></section>
<section id="add" class="hidden"><h2>Daily sale</h2>
<label>Date</label><input id="date" type="date">
<label>Total sale (cash collected, SAR)</label><input id="amt" type="number" inputmode="decimal">
<label>Area</label><select id="area"></select>
<label>Note (optional)</label><input id="note">
<div class="err" id="aerr"></div><button id="save">Save sale</button></section>
<section id="mem" class="hidden"></section>
<section id="prod" class="hidden"></section>
<section id="cust" class="hidden"></section>
<section id="stock" class="hidden"></section>
<section id="set" class="hidden"><h2>Settings</h2>
<div id="tgbox"><label>Monthly target (SAR)</label><input id="tg" type="number" inputmode="decimal">
<button id="stg" class="alt">Save target</button></div>
<div id="arbox"><label>My areas</label><div id="arl"></div>
<input id="na" placeholder="New area, for example Jeddah"><button id="aa" class="alt">Add area</button></div>
<label>New 6-digit password</label><input id="np" type="password" inputmode="numeric" maxlength="6">
<div class="err" id="pmsg"></div><button id="cp" class="alt">Change password</button>
<button id="out2">Sign out</button></section>
</main>
<nav><button data-t="home" class="on">Month</button><button data-t="add">Add sale</button><button data-t="set">Settings</button><button data-t="mem" id="tmem" class="hidden">Members</button><button data-t="prod" id="tprod" class="hidden">Products</button><button data-t="cust" id="tcust" class="hidden">Customers</button><button data-t="stock" id="tstock" class="hidden">Stock</button></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// 1) Paste your Firebase web app config here (Project settings > Your apps)
const CFG={apiKey:"AIzaSyCqCsueTJSETiVjbFE7VdNyPXUZGRMKNqU",authDomain:"chillo-765ef.firebaseapp.com",projectId:"chillo-765ef",storageBucket:"chillo-765ef.firebasestorage.app",messagingSenderId:"1062690319679",appId:"1:1062690319679:web:90dfbe472054dd8f13f78a"};

const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:0});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,uid=null,entries=[],editId=null,unsub=null;

firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const userDoc=()=>db.collection('users').doc(uid);
const sales=()=>userDoc().collection('sales');

function show(id){['login','wait','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function tab(t){
  ['home','add','set','mem','prod','cust','stock'].forEach(x=>$(x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}
function reset(){editId=null;$('amt').value='';$('note').value='';$('aerr').textContent='';$('date').value=ymd(new Date());$('save').textContent='Save sale'}

auth.onAuthStateChanged(async u=>{
  if(!u){show('login');return}
  uid=u.uid;
  try{const s=await userDoc().get();me=s.exists?s.data():null}catch(e){me=null}
  const any=me&&(me.role==='admin'||Object.values(me.perms||{}).some(Boolean));
  if(!me||me.active===false||!any){show('wait');return}
  me.areas=me.areas||[];
  show('app');$('who').textContent=me.name||u.email;start();
});

$('go').onclick=async()=>{
  $('lerr').textContent='';
  try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}
  catch(e){
    const bad=['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(e.code);
    $('lerr').textContent=(bad?'Wrong email or password.':'Sign-in problem.')+' ('+e.code+')';
  }
};
$('out').onclick=$('out2').onclick=()=>auth.signOut();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.t!=='add')reset();tab(b.dataset.t)});

function start(){
  const n=new Date(),a=ymd(new Date(n.getFullYear(),n.getMonth(),1)),b=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  unsub&&unsub();
  unsub=sales().where('date','>=',a).where('date','<=',b).orderBy('date','desc')
    .onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  reset();$('tg').value=me.target||'';fillAreas();applyAccess();if(me.role==='admin')watchMembers();if(can('prod.view'))watchProducts();if(can('cust.view'))watchCusts();if(can('stock.use'))loadStock();
}

function render(){
  if(!can('sales.report')){$('home').innerHTML='<p class="muted">No access to the monthly report.</p>';return}
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate();
  let work=0,done=0;
  for(let d=1;d<=dim;d++){ if(new Date(y,m,d).getDay()!==5){work++;if(d<=n.getDate())done++} } // Friday = holiday
  const left=work-done,elapsed=Math.max(done,1);
  const total=entries.reduce((s,e)=>s+e.amount,0),avg=total/elapsed,proj=avg*work;
  const target=me.target||0,pct=target?Math.round(total/target*100):0;
  const need=target&&left>0?Math.max(0,(target-total)/left):0;
  const byArea={};entries.forEach(e=>{const k=e.area||'No area';byArea[k]=(byArea[k]||0)+e.amount});
  $('home').innerHTML=
   `<div class="muted">${n.toLocaleString('en',{month:'long',year:'numeric'})}</div>
    <div class="big">${fmt(total)} SAR</div>
    <div class="row"><span>Daily average</span><b>${fmt(avg)}</b></div>
    <div class="row"><span>Expected month-end</span><b>${fmt(proj)}</b></div>
    <div class="row"><span>Working days left</span><b>${left}</b></div>`+
   (target?`<div class="row"><span>Target ${fmt(target)}</span><b>${pct}%</b></div>
    <div class="bar"><i style="width:${Math.min(pct,100)}%"></i></div>
    <div class="muted">Need ${fmt(need)} per working day to reach it</div>`:'')+
   `<h3>By area</h3>`+(Object.keys(byArea).map(k=>`<div class="row"><span>${esc(k)}</span><b>${fmt(byArea[k])}</b></div>`).join('')||'<div class="muted">No sales yet this month.</div>')+
   `<h3>Entries</h3>`+entries.map(e=>`<div class="row"><span>${e.date}<br><span class="muted">${esc(e.area||'No area')}${e.note?', '+esc(e.note):''}</span></span>
    <span><b>${fmt(e.amount)}</b>${can('sales.edit')?'<a data-e="'+e.id+'">Edit</a>':''}${can('sales.delete')?'<a data-d="'+e.id+'">Delete</a>':''}</span></div>`).join('');
}
$('home').onclick=ev=>{
  const t=ev.target,e=entries.find(x=>x.id===t.dataset.e);
  if(e){editId=e.id;$('date').value=e.date;$('amt').value=e.amount;$('area').value=e.area||'';$('note').value=e.note||'';$('save').textContent='Update sale';tab('add')}
  if(t.dataset.d&&confirm('Delete this sale entry?'))sales().doc(t.dataset.d).delete().catch(x=>alert(x.message));
};

$('save').onclick=()=>{
  const amount=parseFloat($('amt').value),date=$('date').value;
  if(!date||$('amt').value===''||!(amount>=0)){$('aerr').textContent='Enter the date and the amount.';return}
  const data={date,amount,area:$('area').value,note:$('note').value.trim()};
  (editId?sales().doc(editId).update(data):sales().add({...data,ts:firebase.firestore.FieldValue.serverTimestamp()}))
    .catch(x=>alert('Could not save: '+x.message));
  reset();tab('home');
};

function fillAreas(){
  $('area').innerHTML=me.areas.length?me.areas.map(a=>`<option>${esc(a)}</option>`).join(''):'<option value="">Add areas in Settings</option>';
  $('arl').innerHTML=me.areas.map((a,i)=>`<div class="row"><span>${esc(a)}</span><a data-r="${i}">Remove</a></div>`).join('')||'<div class="muted">No areas yet.</div>';
}
const saveAreas=()=>{userDoc().update({areas:me.areas}).catch(x=>alert(x.message));fillAreas()};
$('aa').onclick=()=>{const v=$('na').value.trim();if(v&&!me.areas.includes(v)){me.areas.push(v);$('na').value='';saveAreas()}};
$('arl').onclick=e=>{if(e.target.dataset.r!==undefined){me.areas.splice(+e.target.dataset.r,1);saveAreas()}};
$('stg').onclick=()=>{me.target=parseFloat($('tg').value)||0;userDoc().update({target:me.target}).catch(x=>alert(x.message));render();tab('home')};

$('cp').onclick=async()=>{
  const p=$('np').value,easy=/^(\d)\1+$/.test(p)||['123456','654321','012345','123123','112233','121212','123321','234567','345678','456789','567890','987654'].includes(p);
  if(!/^\d{6}$/.test(p)){$('pmsg').textContent='Use exactly 6 digits.';return}
  if(easy){$('pmsg').textContent='Avoid easy codes like 123456 or 000000.';return}
  try{await auth.currentUser.updatePassword(p);$('pmsg').textContent='Password changed.';$('np').value=''}
  catch(e){$('pmsg').textContent='Sign out, sign in again, then retry.'}
};

const PERMS={
 'Sales':[['sales.add','Add daily sales'],['sales.edit','Edit sale entries'],['sales.delete','Delete sale entries'],['sales.report','See monthly report']],
 'Products':[['prod.view','View products'],['prod.price','View prices']],
 'Customers':[['cust.view','View customers and mark visits'],['cust.add','Add customers'],['cust.edit','Edit customers'],['cust.delete','Delete customers'],['cust.photo','Shop photo and freezer records']],
 'Stock and orders':[['stock.use','Upload stock, make order, morning check']],
 'Settings':[['set.target','Set own monthly target'],['set.areas','Manage own areas']]};
const can=k=>me.role==='admin'||!!(me.perms&&me.perms[k]);
let members=[],openId=null;

function applyAccess(){
  document.querySelector('[data-t=add]').classList.toggle('hidden',!can('sales.add'));
  $('tmem').classList.toggle('hidden',me.role!=='admin');
  $('tprod').classList.toggle('hidden',!can('prod.view'));
  $('tcust').classList.toggle('hidden',!can('cust.view'));
  $('tstock').classList.toggle('hidden',!can('stock.use'));
  $('tgbox').classList.toggle('hidden',!can('set.target'));
  $('arbox').classList.toggle('hidden',!can('set.areas'));
}
function weakMsg(p){
  if(!/^\d{6}$/.test(p))return 'Use exactly 6 digits.';
  if(/^(\d)\1+$/.test(p)||['123456','654321','012345','123123','112233','121212','123321','234567','345678','456789','567890','987654'].includes(p))return 'Avoid easy codes like 123456 or 000000.';
  return '';
}
function watchMembers(){
  db.collection('users').onSnapshot(s=>{members=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.id!==uid);if(!openId)drawMembers()});
}
function drawMembers(){
  const m=members.find(x=>x.id===openId);
  if(m){
    const p=m.perms||{};
    $('mem').innerHTML=`<a id="back" style="margin:0">Back to members</a><h2>${esc(m.name)}</h2>
    <div class="muted">${esc(m.email||'')}<br>${esc(m.branch||'No branch')}</div>
    <div class="row"><label for="act">Account active</label><input id="act" type="checkbox" ${m.active!==false?'checked':''}></div>`+
    Object.keys(PERMS).map(c=>`<h3>${c}</h3>`+PERMS[c].map(([k,t])=>`<div class="row"><label for="p_${k}">${t}</label><input id="p_${k}" data-k="${k}" type="checkbox" ${p[k]?'checked':''}></div>`).join('')).join('')+
    `<p><button id="pall" class="alt">Switch all on</button><button id="pnone" class="alt">Switch all off</button></p>
    <div class="err" id="mmsg"></div><button id="msave">Save</button><button id="mreset" class="alt">Send password reset email</button>`;
    return;
  }
  $('mem').innerHTML=`<h2>Add member</h2>
  <label>Name</label><input id="mname"><label>Email</label><input id="memail" type="email">
  <label>Branch</label><input id="mbranch"><label>Starting 6-digit password</label><input id="mpass" type="password" inputmode="numeric" maxlength="6">
  <div class="err" id="amsg"></div><button id="addm">Create member</button>
  <h2>Members</h2>`+(members.map(m=>`<div class="row"><span>${esc(m.name)}<br><span class="muted">${esc(m.branch||'No branch')}${m.active===false?', inactive':''}</span></span><a data-m="${m.id}">Manage</a></div>`).join('')||'<div class="muted">No members yet.</div>');
}
async function addMember(){
  const name=$('mname').value.trim(),email=$('memail').value.trim(),branch=$('mbranch').value.trim(),pw=$('mpass').value,msg=$('amsg');
  if(!name||!email){msg.textContent='Enter the name and email.';return}
  if(weakMsg(pw)){msg.textContent=weakMsg(pw);return}
  msg.textContent='Creating...';let sec;
  try{
    sec=firebase.initializeApp(CFG,'sec'+Date.now());
    const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
    await db.collection('users').doc(c.user.uid).set({name,email,branch,role:'sales',active:true,perms:{}});
    ['mname','memail','mbranch','mpass'].forEach(i=>$(i).value='');
    msg.textContent='Member created. Tap Manage to switch on their permissions.';
  }catch(e){msg.textContent='Could not create: '+(e.code||e.message)}
  finally{sec&&sec.delete()}
}
$('mem').onclick=async ev=>{
  const t=ev.target;
  if(t.id==='addm')return addMember();
  if(t.dataset.m){openId=t.dataset.m;drawMembers();return}
  if(t.id==='back'){openId=null;drawMembers();return}
  if(t.id==='pall'||t.id==='pnone'){document.querySelectorAll('#mem [data-k]').forEach(c=>c.checked=t.id==='pall');return}
  if(t.id==='msave'){
    const perms={};document.querySelectorAll('#mem [data-k]').forEach(c=>perms[c.dataset.k]=c.checked);
    db.collection('users').doc(openId).update({active:$('act').checked,perms}).then(()=>$('mmsg').textContent='Saved.').catch(e=>$('mmsg').textContent=e.message);
  }
  if(t.id==='mreset'){
    const m=members.find(x=>x.id===openId);
    auth.sendPasswordResetEmail(m.email).then(()=>$('mmsg').textContent='Reset email sent to '+m.email).catch(e=>$('mmsg').textContent=e.message);
  }
};

let prods=[],pq='',pcat='',pedit=null;
const idOf=c=>String(c).trim().replace(/\//g,'-');
const money=n=>Number(n).toLocaleString('en',{maximumFractionDigits:2});
let reqs=[];
function watchProducts(){
  if(me.role==='admin')db.collection('productRequests').onSnapshot(s=>{reqs=s.docs.map(d=>({id:d.id,...d.data()}));if(pedit===null)drawProds()},()=>{});
  db.collection('products').orderBy('name').onSnapshot(s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));if(pedit===null)drawProds()},()=>{});
}
function drawList(){
  const price=can('prod.price'),admin=me.role==='admin',q=pq.toLowerCase();
  const list=prods.filter(p=>(!pcat||p.category===pcat)&&(!q||((p.name||'')+' '+(p.code||'')).toLowerCase().includes(q)));
  $('plist').innerHTML=`<div class="muted">${list.length} products</div>`+list.map(p=>`<div class="row"><span>${esc(p.name)}<br><span class="muted">${esc(p.code)}${p.pack?', '+esc(p.pack):''}${p.category?', '+esc(p.category):''}</span></span>
   <span>${price&&p.price!=null?'<b>'+money(p.price)+'</b>':''}${admin?'<a data-pe="'+esc(p.id)+'">Edit</a>':''}</span></div>`).join('');
}
function drawProds(){
  const admin=me.role==='admin',cats=[...new Set(prods.map(p=>p.category).filter(Boolean))].sort();
  if(pedit!==null){
    const p=prods.find(x=>x.id===pedit)||{};
    $('prod').innerHTML=`<h2>${pedit?'Edit product':'Add product'}</h2>
    <label>Code</label><input id="pcode" value="${esc(p.code)}" ${pedit?'readonly':''}>
    <label>Name</label><input id="pname" value="${esc(p.name)}">
    <label>Pack</label><input id="ppack" value="${esc(p.pack)}" placeholder="for example 1*30*60 GM">
    <label>Unit</label><input id="punit" value="${esc(p.unit||'Carton')}">
    <label>Category</label><input id="pcat" list="cl" value="${esc(p.category)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <label>Price per unit (SAR)</label><input id="pprice" type="number" inputmode="decimal" value="${p.price==null?'':p.price}">
    <div class="err" id="pmsg2"></div><button id="psave">Save</button><button id="pcancel" class="alt">Cancel</button>${pedit?'<button id="pdel" class="alt">Delete product</button>':''}`;
    return;
  }
  $('prod').innerHTML=`<h2>Products</h2>${pendHtml()}<input id="pq" placeholder="Search name or code" value="${esc(pq)}">
  <select id="pc"><option value="">All categories</option>${cats.map(c=>`<option ${c===pcat?'selected':''}>${esc(c)}</option>`).join('')}</select>`+
  (admin?`<button id="padd">Add product</button><button id="pimp" class="alt">Import from Excel</button><button id="ptpl" class="alt">Download Excel template</button><input id="pfile" type="file" accept=".xlsx,.xls,.csv" class="hidden"><div class="err" id="pmsg2"></div>`:'')+`<div id="plist"></div>`;
  drawList();
}
async function importFile(f){
  const msg=$('pmsg2');msg.textContent='Reading file...';
  try{
    const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    let ok=0,skip=0,n=0,batch=db.batch();
    for(const r of rows){
      const k={};Object.keys(r).forEach(h=>k[String(h).trim().toLowerCase()]=r[h]);
      const code=String(k.code||'').trim(),name=String(k.name||'').trim();
      if(!code||!name){skip++;continue}
      const pr=parseFloat(k.price);
      batch.set(db.collection('products').doc(idOf(code)),{code,name,pack:String(k.pack||'').trim(),unit:String(k.unit||'Carton').trim(),category:String(k.category||'').trim(),price:isNaN(pr)?null:pr},{merge:true});
      ok++;n++;
      if(n===400){await batch.commit();batch=db.batch();n=0}
    }
    if(n)await batch.commit();
    msg.textContent='Imported '+ok+' products'+(skip?', skipped '+skip+' rows without code or name':'')+'.';
  }catch(e){msg.textContent='Import failed: '+e.message}
}
function template(){
  const ws=XLSX.utils.aoa_to_sheet([['Code','Name','Pack','Unit','Category','Price'],['FG-ICE-0001','Example Vanilla Cups','1*30*40 GM','Carton','Cups',50]]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Products');XLSX.writeFile(wb,'chillo-products-template.xlsx');
}
$('prod').onclick=ev=>{

let cs=[],cmode='list',cid=null,cshow='all',csort='az',cq='',pos=null,ed={};
const DAYS=[[6,'Sat'],[0,'Sun'],[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu']];
const dn=d=>(DAYS.find(x=>x[0]===d)||[0,'?'])[1];
const custs=()=>userDoc().collection('customers');
const stamp=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
function watchCusts(){custs().orderBy('name').onSnapshot(s=>{cs=s.docs.map(d=>({id:d.id,...d.data()}));if(cmode==='list')drawCust();if(cmode==='view')drawView()},()=>{})}
function parseLoc(t){
  t=String(t||'');const m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
  return m?{lat:+m[1],lng:+m[2]}:null;
}
function dist(c){
  if(!pos||c.lat==null)return null;const r=x=>x*Math.PI/180,dl=r(c.lat-pos.lat),dg=r(c.lng-pos.lng);
  const a=Math.sin(dl/2)**2+Math.cos(r(pos.lat))*Math.cos(r(c.lat))*Math.sin(dg/2)**2;return 6371*2*Math.asin(Math.sqrt(a));
}
function missed(c){
  if(c.type!=='fixed')return false;const t=new Date(),ws=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+1)%7));
  return (c.days||[]).some(dd=>{const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+(dd+1)%7);return ymd(d)<ymd(t)&&(c.lastVisit||'')<ymd(d)});
}
function isToday(c){
  return (c.type==='fixed'&&(c.days||[]).includes(new Date().getDay()))||(c.type==='call'&&c.calledAt&&c.calledAt>(c.lastVisit||''));
}
function drawCust(){

  <label>Order</label><select id="co2"><option value="az">A to Z</option><option value="near" ${csort==='near'?'selected':''}>Nearest first</option></select>
  ${can('cust.add')?'<button id="cadd">Add customer</button>':''}<div id="clist"></div>`;

}
function drawCList(){
  const q=cq.toLowerCase();
  let l=cs.filter(c=>(!q||((c.name||'')+' '+(c.owner||'')+' '+(c.phone||'')).toLowerCase().includes(q))&&
    (cshow==='all'||(cshow==='today'&&isToday(c))||(cshow[0]==='d'&&c.type==='fixed'&&(c.days||[]).includes(+cshow.slice(1)))||(cshow==='random'&&c.type==='random')||(cshow==='call'&&c.type==='call')||(cshow==='missed'&&missed(c))));
  if(csort==='near'&&pos)l.sort((a,b)=>(dist(a)??1e9)-(dist(b)??1e9));
  $('clist').innerHTML=`<div class="muted">${l.length} customers</div>`+l.map(c=>{const d=dist(c);
    return `<div class="row" data-v="${c.id}"><span><b>${esc(c.name)}</b><br><span class="muted">${esc(c.area||'No area')}, ${c.type==='fixed'?(c.days||[]).map(dn).join(' '):c.type==='call'?'On call':'Random'}</span></span>

}

let fzPhoto='';
function editPhoto(file,cb){
  const img=new Image(),W=320,H=240;
  img.onload=()=>{
    let rot=0,z=1,ox=0,oy=0,d0=0,z0=1;const pts=new Map();
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
    ov.innerHTML='<canvas width="320" height="240" style="touch-action:none;background:#000"></canvas><div style="color:#fff;font-size:14px">Drag to move, pinch or use the slider to zoom</div><input type="range" min="1" max="4" step="0.05" value="1" style="width:320px"><div style="display:flex;gap:8px;width:320px"><button class="alt" id="er">Rotate</button><button class="alt" id="ec">Cancel</button><button id="es">Use photo</button></div>';
    document.body.appendChild(ov);
    const cv=ov.querySelector('canvas'),sl=ov.querySelector('input'),ctx=cv.getContext('2d');
    const base=()=>{const w=rot%2?img.height:img.width,h=rot%2?img.width:img.height;return Math.max(W/w,H/h)};
    const draw=(c,k)=>{c.fillStyle='#000';c.fillRect(0,0,W*k,H*k);c.save();c.translate(W*k/2+ox*k,H*k/2+oy*k);c.rotate(rot*Math.PI/2);const sc=base()*z*k;c.scale(sc,sc);c.drawImage(img,-img.width/2,-img.height/2);c.restore()};
    const paint=()=>draw(ctx,1);paint();
    const dd=()=>{const[a,b]=[...pts.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
    sl.oninput=()=>{z=+sl.value;paint()};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){d0=dd();z0=z}};
    cv.onpointermove=e=>{
      if(!pts.has(e.pointerId))return;const q=pts.get(e.pointerId);
      if(pts.size===1){ox+=e.clientX-q[0];oy+=e.clientY-q[1]}
      pts.set(e.pointerId,[e.clientX,e.clientY]);
      if(pts.size===2){z=Math.min(4,Math.max(1,z0*dd()/d0));sl.value=z}
      paint();
    };
    cv.onpointerup=cv.onpointercancel=e=>pts.delete(e.pointerId);
    ov.querySelector('#er').onclick=()=>{rot=(rot+1)%4;paint()};
    ov.querySelector('#ec').onclick=()=>ov.remove();
    ov.querySelector('#es').onclick=()=>{const o=document.createElement('canvas');o.width=960;o.height=720;draw(o.getContext('2d'),3);ov.remove();cb(o.toDataURL('image/jpeg',0.72))};
  };
  img.src=URL.createObjectURL(file);
}

  i.onchange=()=>{if(i.files[0])editPhoto(i.files[0],cb)};i.click();
}

function parseStock(text){
  const rows=[],seen={};let cur=null;
  const fin=()=>{
    if(!cur)return;const m=cur.rest.match(/(\d{4})/)||cur.first.match(/-\s?(\d{4})\b/);if(!m)return;
    const key=(/FG[-\s]*SA/i.test(cur.first)?'SA':'ICE')+m[1];if(seen[key])return;seen[key]=1;
    const name=(cur.first.replace(/^FG[-\s]*(ICE|SA)?\s*/i,'')+' '+cur.rest.replace(/^\s*[A-Z]?\s*-?\s*\d{4}\s*/,'')).replace(/\s+/g,' ').trim();
    const cm=cur.rest.match(/^\s*([A-Z]?)\s*-?\s*(\d{4})/),pre=key.startsWith('SA')?'SA':'ICE';
    rows.push({key,code:'FG-'+pre+(pre==='SA'&&cm&&cm[1]?cm[1]:'')+'-'+m[1],name,orig:cur.orig,rem:cur.rem});
  };
  for(const l of text.split('\n').map(x=>x.trim()).filter(Boolean)){
    const m=l.match(/(\d{1,5}[.,]\d{3})\s+(\d{1,5}[.,]\d{3})\s*$/);
    if(m){fin();cur={first:l.slice(0,m.index).replace(/\bCarton\b/i,'').trim(),rest:'',orig:+m[1].replace(',','.'),rem:+m[2].replace(',','.')}}
    else if(cur)cur.rest+=' '+l;
  }
  fin();return rows;
}
const keyOf=c=>{const d=(String(c).match(/(\d{4})\s*$/)||[])[1];return d?((/^FG[-\s]*SA/i.test(c)?'SA':'ICE')+d):null};
function knownList(){
  const m={};((st.night&&st.night.rows)||[]).forEach(r=>m[r.key]={key:r.key,name:r.name});
  prods.forEach(p=>{const k=keyOf(p.code);if(k)m[k]={key:k,name:p.name}});return Object.values(m);
}
function missingHtml(){
  const have=new Set(st.rows.map(r=>r.key));st.missing=knownList().filter(k=>!have.has(k.key));
  return st.missing.length?`<h3>Not read (${st.missing.length})</h3><p class="muted">If any of these are in the screenshot, type their numbers.</p>`+st.missing.map((k,i)=>`<div class="row"><span>${esc(k.name)}</span><span style="display:flex;gap:6px"><input data-m="${i}" data-f="orig" type="number" step="any" placeholder="Orig" style="width:76px;margin:0;padding:6px"><input data-m="${i}" data-f="rem" type="number" step="any" placeholder="Rem" style="width:76px;margin:0;padding:6px"></span></div>`).join(''):'';
}
function offerNew(rows){
  const have=new Set(prods.map(p=>keyOf(p.code))),nw=rows.filter(r=>r.code&&!have.has(r.key));if(!nw.length)return;
  const mk=r=>{const pm=r.name.match(/\s(\d+[*x]\S.*)$/);return{code:r.code,name:r.name,pack:pm?pm[1]:'',unit:'Carton',category:'',price:null}};
  if(me.role==='admin'){
    if(confirm(nw.length+' products are not in your Products list yet. Add them now with the price empty?')){
      const b=db.batch();nw.forEach(r=>b.set(db.collection('products').doc(idOf(r.code)),mk(r),{merge:true}));b.commit().catch(e=>alert(e.message));
    }
  }else{
    nw.forEach(r=>db.collection('productRequests').doc(idOf(r.code)).set({...mk(r),uid}).catch(()=>{}));
    alert(nw.length+' new products were sent to the admin for approval.');
  }
}
function pendHtml(){

}
let st={v:'order',stage:'pick',cfg:{},doors:[],night:null,order:null,rows:null,html:''};

async function loadStock(){
  try{const q=await userDoc().collection('loadcfg').get();q.docs.forEach(d=>{if(d.id==='_doors')st.doors=d.data().names;else st.cfg[d.id]=d.data()})}catch(e){}
  if(!st.doors||st.doors.length!==8)st.doors=[1,2,3,4,5,6,7,8].map(i=>'Door '+i);
  for(const k of ['night','order']){try{const d=await stk().doc(k).get();st[k]=d.exists?d.data():null}catch(e){}}
  drawStock();
}
async function ocr(file,say){
  const img=await createImageBitmap(file),W=img.width,H=img.height,S=1500,O=120,txt=[];
  say('Loading the reader (needs internet the first time)...');
  const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_pageseg_mode:'6'});
  for(let y=0,i=1;y<H;y+=S-O,i++){
    const h=Math.min(S,H-y),c=document.createElement('canvas');c.width=W;c.height=h;const cx=c.getContext('2d');cx.drawImage(img,0,y,W,h,0,0,W,h);const id=cx.getImageData(0,0,W,h),a=id.data;for(let j=0;j<a.length;j+=4){const g=.3*a[j]+.59*a[j+1]+.11*a[j+2],v=g<125?0:255;a[j]=a[j+1]=a[j+2]=v}cx.putImageData(id,0,0);
    say('Reading part '+i+'...');txt.push((await w.recognize(c)).data.text);if(y+h>=H)break;
  }
  await w.terminate();return parseStock(txt.join('\n'));
}
const NOTE={order:'Upload the screenshot taken when about 90% of sales are done.',night:'Upload the screenshot after all sales are closed.',morning:'Upload the screenshot after loading is entered.'};
function drawStock(){
  $('stock').innerHTML=`<h2>Stock</h2><select id="sv">${[['order','1. Make order (evening)'],['night','2. Night stock (sales closed)'],['morning','3. Morning check'],['setup','Load setup']].map(([v,t])=>`<option value="${v}" ${v===st.v?'selected':''}>${t}</option>`).join('')}</select><div id="sb"></div>`;
  drawSB();
}
function drawSB(){
  const b=$('sb');
  if(st.v==='setup')return drawSetup();
  if(st.stage==='review')return drawReview();
  if(st.stage==='order')return drawOrder();
  if(st.stage==='done'){b.innerHTML=st.html+'<button id="sagain" class="alt">Start again</button>';return}
  b.innerHTML=`<p class="muted">${NOTE[st.v]}</p><button id="sup">Choose screenshot</button><div class="muted" id="sst"></div>`;
}
function drawReview(){
  $('sb').innerHTML=`<p class="muted">${st.rows.length} products read. Check the numbers and fix any mistakes.</p>`+
   `<div class="row"><b>Product</b><b>Orig / Rem</b></div>`+st.rows.map((r,i)=>`<div class="row"><span>${esc(r.name)}</span><span style="display:flex;gap:6px"><input data-i="${i}" data-f="orig" type="number" step="any" value="${r.orig}" style="width:76px;margin:0;padding:6px"><input data-i="${i}" data-f="rem" type="number" step="any" value="${r.rem}" style="width:76px;margin:0;padding:6px"></span></div>`).join('')+
   `${missingHtml()}<p></p><button id="sok">Use these numbers</button><button id="sagain" class="alt">Cancel</button>`;
}
function drawOrder(){
  const rows=st.rows.filter(r=>st.cfg[r.key]&&st.cfg[r.key].max>0),no=st.rows.length-rows.length;
  rows.sort((a,b)=>(st.cfg[a.key].door??9)-(st.cfg[b.key].door??9));let last='',h='';
  rows.forEach(r=>{const c=st.cfg[r.key],d=c.door===''||c.door==null?'No door':st.doors[c.door];
    if(d!==last){h+=`<h3>${esc(d)}</h3>`;last=d}
    h+=`<div class="row"><span>${esc(r.name)}<br><span class="muted">Remaining ${r.rem}, max ${c.max}</span></span><input data-o="${r.key}" data-n="${esc(r.name)}" data-d="${d}" type="number" step="any" value="${Math.max(0,c.max-r.rem)}" style="width:80px;margin:0"></div>`});
  $('sb').innerHTML=`<p class="muted">Order = max load minus remaining. Change any quantity you want.${no?' '+no+' products have no max set (see Load setup).':''}</p>${h||'<p>No products have a max load yet. Set them in Load setup.</p>'}<p></p><button id="osave">Save order</button><button id="oshare" class="alt">Share on WhatsApp</button>`;
}
function drawSetup(){
  const src=(st.night&&st.night.rows)||st.rows||[];
  $('sb').innerHTML=`<h3>Door names</h3>`+st.doors.map((d,i)=>`<input data-dn="${i}" value="${esc(d)}">`).join('')+
   `<h3>Max load and door per product</h3>`+(src.length?src.map(r=>{const c=st.cfg[r.key]||{};return `<div class="row"><span>${esc(r.name)}</span><span style="display:flex;gap:6px"><input data-k="${r.key}" data-f="max" type="number" placeholder="Max" value="${c.max||''}" style="width:70px;margin:0;padding:6px"><select data-k="${r.key}" data-f="door" style="width:96px;margin:0;padding:6px"><option value="">Door</option>${st.doors.map((d,i)=>`<option value="${i}" ${c.door===i?'selected':''}>${esc(d)}</option>`).join('')}</select></span></div>`}).join(''):'<p class="muted">Upload and save a night stock screenshot first, so the product list can be read from it.</p>')+
   `<p></p><button id="cfsave">Save setup</button><div class="muted" id="cfm"></div>`;
}
function compare(m){
  const nm={},od={};((st.night&&st.night.rows)||[]).forEach(r=>nm[r.key]=r);((st.order&&st.order.rows)||[]).forEach(r=>od[r.key]=r.qty);
  let ok=0,bad=0;
  const h=m.map(r=>{const n=nm[r.key],ld=n?r.orig-n.rem:null,o=od[r.key]||0,df=ld==null?null:ld-o,good=df!=null&&Math.abs(df)<0.0005;good?ok++:bad++;
    return `<div class="row"><span>${esc(r.name)}<br><span class="muted">Ordered ${o}, loaded ${ld==null?'?':ld}</span></span><b style="color:${good?'#1E8E4E':'#C0392B'}">${ld==null?'No night data':good?'OK':df>0?'Excess +'+df:'Short '+df}</b></div>`}).join('');
  return `<h3>${ok} OK, ${bad} to check</h3>`+h;
}
function pickShot(){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;
    try{st.rows=await ocr(f,t=>{$('sst').textContent=t});
      if(!st.rows.length){$('sst').textContent='Could not read any products. Try a clearer, full-width screenshot.';return}
      st.stage='review';drawSB()}catch(e){$('sst').textContent='Reading failed: '+e.message}};
  i.click();
}
$('stock').onclick=ev=>{
  const t=ev.target;
  if(t.id==='sup')pickShot();
  else if(t.id==='sagain'){st.stage='pick';st.rows=null;drawSB()}
  else if(t.id==='sok'){
    document.querySelectorAll('#sb [data-i]').forEach(x=>st.rows[x.dataset.i][x.dataset.f]=parseFloat(x.value)||0);
    const mm={};document.querySelectorAll('#sb [data-m]').forEach(x=>{(mm[x.dataset.m]=mm[x.dataset.m]||{})[x.dataset.f]=x.value});
    Object.keys(mm).forEach(i=>{if(mm[i].orig!==''||mm[i].rem!==''){const k=st.missing[i];st.rows.push({key:k.key,name:k.name,orig:parseFloat(mm[i].orig)||0,rem:parseFloat(mm[i].rem)||0})}});
    offerNew(st.rows);
    const d={date:ymd(new Date()),rows:st.rows};
    if(st.v==='order'){stk().doc('evening').set(d).catch(()=>{});st.stage='order';drawSB()}
    else if(st.v==='night'){stk().doc('night').set(d).catch(e=>alert(e.message));st.night=d;st.html='<p>Night stock saved ('+d.rows.length+' products). Use Load setup to set max loads.</p>';st.stage='done';drawSB()}
    else{stk().doc('morning').set(d).catch(()=>{});st.html=compare(d.rows);st.stage='done';drawSB()}
  }
  else if(t.id==='osave'||t.id==='oshare'){
    const rows=[...document.querySelectorAll('#sb [data-o]')].map(x=>({key:x.dataset.o,name:x.dataset.n,door:x.dataset.d,qty:parseFloat(x.value)||0}));
    if(t.id==='osave'){st.order={date:ymd(new Date()),rows};stk().doc('order').set(st.order).catch(e=>alert(e.message));st.html='<p>Order saved. Use Morning check after loading.</p>';st.stage='done';drawSB()}
    else{let txt='Order '+ymd(new Date()),dd='';rows.filter(r=>r.qty>0).forEach(r=>{if(r.door!==dd){txt+='\n\n'+r.door;dd=r.door}txt+='\n'+r.name+': '+r.qty});window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
  }
  else if(t.id==='cfsave'){
    const b=db.batch(),cl=userDoc().collection('loadcfg'),src=(st.night&&st.night.rows)||[];
    st.doors=[...document.querySelectorAll('#sb [data-dn]')].map(x=>x.value.trim()||'Door');b.set(cl.doc('_doors'),{names:st.doors});
    src.forEach(r=>{const mx=document.querySelector(`#sb [data-k="${r.key}"][data-f=max]`),dr=document.querySelector(`#sb [data-k="${r.key}"][data-f=door]`);
      const c={name:r.name,max:parseFloat(mx.value)||0,door:dr.value===''?null:+dr.value};st.cfg[r.key]=c;b.set(cl.doc(r.key),c)});
    b.commit().then(()=>$('cfm').textContent='Saved.').catch(e=>$('cfm').textContent=e.message);
  }
};
$('stock').onchange=ev=>{if(ev.target.id==='sv'){st.v=ev.target.value;st.stage='pick';st.rows=null;drawSB()}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
