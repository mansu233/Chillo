<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2BB5E8"><meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Chillo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&display=swap" rel="stylesheet">
<script>try{document.documentElement.style.setProperty('--fs',localStorage.getItem('chillo_fs')||'1')}catch(e){}</script>
<style>
:root{--navy:#16478A;--cyan:#1DB1E8;--ink:#1A2B4A;--hl:#16478A;--bg:#FFFFFF;--card:#FFFFFF;--input:#FFFFFF;--line:#D3DCE8;--bad:#C0392B;--pink:#FF7BAC;--blue:#1DB1E8;--blue2:#16478A;--shadow:0 6px 18px rgba(16,58,122,.2)}
@media (prefers-color-scheme:dark){:root{--ink:#E8F0FB;--hl:#9CC4FF;--bg:#0B1B33;--card:#10284A;--input:#0D2240;--line:#27436E;--shadow:0 6px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs,1))}
body{margin:0;font:1rem/1.45 Cairo,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#1A4C90;color:#fff;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 10px}
#hback{grid-column:1}#htitle{grid-column:2}#hset{grid-column:3}
#htitle{text-align:center;font-weight:600;letter-spacing:.16em;font-size:1rem}
.hbtn{background:none!important;box-shadow:none!important;border:0;padding:0;margin:0;width:42px;height:42px;color:#fff;display:flex;align-items:center;justify-content:center;letter-spacing:0}
main{max-width:520px;margin:0 auto;padding:0 0 30px}
main section{padding:20px 18px}
#menu{padding:0}
.mhero{background:linear-gradient(180deg,#1A4C90,#123F80);padding:4px 16px 70px;text-align:center;color:#fff}
.av{width:92px;height:92px;border-radius:50%;background:#fff;margin:6px auto 10px;display:flex;align-items:center;justify-content:center}
.hname{font-size:1.2rem;font-weight:600;letter-spacing:.12em}.hmail{font-size:.85rem;opacity:.85;letter-spacing:.04em}
.bal{background:var(--card);border-radius:8px;margin:-52px 22px 0;padding:14px 12px 10px;text-align:center;box-shadow:var(--shadow);position:relative}
.bl{color:var(--cyan);font-size:.75rem;letter-spacing:.16em;font-weight:600}
.bn{font-size:2rem;font-weight:800;color:var(--hl);margin:2px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 6px;padding:28px 16px 14px}
.gi{background:none!important;box-shadow:none!important;color:var(--ink);border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:500;font-size:.8rem;letter-spacing:0;text-transform:none}
.gc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.2)}
.gc svg{width:28px;height:28px}
.hidden{display:none!important}
h1{font-size:2rem;margin:6px 0;font-weight:500}
h2{font-size:1rem;margin:0 0 12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl);text-align:center}
main section>h2:first-child{display:none}
h3{font-size:.8rem;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);text-align:center}
input,select,button{font:inherit;width:100%;padding:10px 12px;border:1px solid #9FB2CC;border-radius:3px;background:var(--input);color:var(--ink);margin:4px 0 12px;outline:none}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(29,177,232,.25)}
button{background:var(--navy);color:#fff;border:0;font-weight:600;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;padding:12px 14px}
button:active{opacity:.85}
button.alt{background:transparent;color:var(--hl);border:1.5px solid var(--hl)}
button.sm,.sm{width:auto;min-width:130px;display:inline-block;padding:10px 22px;margin:6px 0 4px}
#cdel,#pdel,#odel,#rclr,#creset{color:var(--bad);border-color:#E9B4AD}
label{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--hl)}
.big{font-size:2.6rem;font-weight:800;margin:2px 0 10px;color:var(--hl)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:26px;height:26px;border-radius:50%;background:var(--navy);flex:none}
.row:nth-child(even)>.dot{background:var(--cyan)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:5px}
.muted{opacity:.65;font-size:.875rem}.err{color:var(--bad);font-size:.875rem;min-height:18px}
a{color:var(--hl);background:rgba(29,177,232,.14);padding:4px 11px;border-radius:999px;font-size:.8125rem;font-weight:700;margin-left:8px;cursor:pointer;white-space:nowrap}
input[type=checkbox]{width:24px;height:24px;margin:0;flex:none;accent-color:#16478A}
details summary{cursor:pointer;font-weight:600}
nav{display:none}
.lg-top{background:linear-gradient(180deg,#1A4C90,#123F80);color:#fff;text-align:center;padding:calc(54px + env(safe-area-inset-top)) 20px 44px}
.lg-top h1{letter-spacing:.06em;margin:0 0 26px}
.lg-logo{width:150px;height:150px;border-radius:50%;background:#fff;margin:0 auto;display:flex;align-items:center;justify-content:center}
.hero{text-align:center;padding:28px 24px 30px}
.hero input{text-align:center}
.amtbig{font-size:2rem;font-weight:800;text-align:right;color:var(--hl);padding:12px 14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 0 16px;background:var(--bg)}
.kp button{margin:0;border-radius:0;height:56px;font-size:1.5rem;font-weight:600;letter-spacing:0;text-transform:none;background:linear-gradient(180deg,#1B5AA8,#14468C)}
.pills{display:flex;gap:6px;margin:0 0 14px}
.pills button{margin:0;flex:1;border-radius:8px 8px 0 0;background:#8995A8;font-size:.72rem;padding:12px 4px;letter-spacing:.1em}
.pills button.on{background:var(--cyan)}
.sav{width:72px;height:72px;margin:0 auto 6px;border:2px solid var(--line)}
.mcard{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 14px}
.mcard.ok{border-left-color:#1E8E4E}
.mok{color:#1E8E4E;font-weight:600;margin:6px 0 8px}
#upd{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:var(--navy);color:#fff;border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
</style></head><body>

<div id="login" class="hidden"><div class="lg-top"><h1>WELCOME!</h1><div class="lg-logo"><img src="icon.svg" width="112" height="112" alt=""></div></div>
<main class="hero"><input id="em" type="email" autocomplete="username" placeholder="Username or Email">
<input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password">
<div class="err" id="lerr"></div><button id="go" class="sm">Log in</button><p class="muted">Chillo <span class="ver"></span></p></main></div>

<div id="wait" class="hidden"><main><h1>Waiting for admin access</h1>
<p>Your account has no access yet. Ask your admin to switch it on.</p>
<button class="alt" id="out">Sign out</button></main></div>

<div id="app" class="hidden">
<header><button class="hbtn hidden" id="hback" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div id="htitle">CHILLO</div><button class="hbtn" id="hset" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></header>
<main>
<section id="menu"><div class="mhero"><div class="av"><svg width="62" height="62" viewBox="0 0 24 24" fill="#1DB1E8"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c.6-4.4 3.8-6.6 8-6.6s7.4 2.2 8 6.6z"/></svg></div><div id="who" class="hname"></div><div id="hmail" class="hmail"></div></div>
<div class="bal"><div class="bl">THIS MONTH</div><div class="bn" id="mtot">0 SAR</div><button id="mbtn" class="sm">Add sale</button></div>
<div class="grid" id="mgrid"></div><p class="muted" style="text-align:center">Chillo <span class="ver"></span></p></section>
<section id="home" class="hidden"></section>
<section id="add" class="hidden"><h2>Daily sale</h2>
<label>Date</label><input id="date" type="date">
<label>Total sale (cash collected, SAR)</label><input id="amt" type="number" inputmode="decimal" class="amtbig" placeholder="0"><div class="kp" id="kp"><button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" data-k="00">00</button><button type="button" data-k="0">0</button><button type="button" data-k="b">&#9003;</button></div>
<label>Area</label><select id="area"></select>
<label>Note (optional)</label><input id="note">
<div class="err" id="aerr"></div><button id="save">Save sale</button></section>
<section id="mem" class="hidden"></section>
<section id="prod" class="hidden"></section>
<section id="cust" class="hidden"></section>
<section id="stock" class="hidden"></section>
<section id="lsetup" class="hidden"></section>
<section id="rem" class="hidden"></section>
<section id="team" class="hidden"></section>
<section id="close" class="hidden"></section>
<section id="set" class="hidden"><h2>Settings</h2>
<div style="text-align:center;margin-bottom:10px"><div class="av sav"><svg width="44" height="44" viewBox="0 0 24 24" fill="#1DB1E8"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c.6-4.4 3.8-6.6 8-6.6s7.4 2.2 8 6.6z"/></svg></div><div id="sname" class="hname" style="color:var(--hl)"></div><div id="smail" class="muted"></div></div>
<div id="tgbox"><label>Monthly target (SAR)</label><input id="tg" type="number" inputmode="decimal">
<button id="stg" class="alt">Save target</button></div>
<div id="brbox" class="hidden"><label>Branches (admin)</label><div id="brl"></div><input id="nb" placeholder="New branch, for example Jeddah"><button id="ba" class="alt">Add branch</button></div>
<div id="arbox"><label>My areas</label><div id="arl"></div>
<input id="na" placeholder="New area, for example Jeddah"><button id="aa" class="alt">Add area</button></div>
<label>New 6-digit password</label><input id="np" type="password" inputmode="numeric" maxlength="6">
<div class="err" id="pmsg"></div><button id="cp" class="alt">Change password</button>
<label>Show barcode numbers</label><select id="bcs"><option value="0">Hide (default)</option><option value="1">Show</option></select>
<label>Text size</label><select id="fsz"><option value="0.9">Small</option><option value="1">Normal</option><option value="1.12">Large</option><option value="1.25">Extra large</option></select>
<p class="muted">Chillo <span class="ver"></span></p><button id="out2">Sign out</button></section>
</main>
<nav><button data-t="home" class="on">Month</button><button data-t="add">Add sale</button><button data-t="set">Settings</button><button data-t="mem" id="tmem" class="hidden">Members</button><button data-t="prod" id="tprod" class="hidden">Products</button><button data-t="cust" id="tcust" class="hidden">Customers</button><button data-t="stock" id="tstock" class="hidden">Stock</button><button data-t="lsetup" id="tlsetup" class="hidden">Load setup</button><button data-t="rem" id="trem" class="hidden">Reminders</button><button data-t="team" id="tteam" class="hidden">Team</button><button data-t="close" id="tclose" class="hidden">Close day</button></nav>
</div>

<div id="upd" class="hidden"><span id="updt" style="flex:1"></span><button id="updb" class="sm" style="background:#fff;color:#16478A;margin:0;min-width:90px">Update</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// 1) Paste your Firebase web app config here (Project settings > Your apps)
const CFG={apiKey:"AIzaSyCqCsueTJSETiVjbFE7VdNyPXUZGRMKNqU",authDomain:"chillo-765ef.firebaseapp.com",projectId:"chillo-765ef",storageBucket:"chillo-765ef.firebasestorage.app",messagingSenderId:"1062690319679",appId:"1:1062690319679:web:90dfbe472054dd8f13f78a"};

const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:0});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,uid=null,entries=[],editId=null,unsub=null;

firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const userDoc=()=>db.collection('users').doc(uid);
const sales=()=>userDoc().collection('sales');

function show(id){['login','wait','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function tab(t){
  ['home','add','set','mem','prod','cust','stock','lsetup','rem','team','menu','close'].forEach(x=>$(x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='lsetup')drawSetup();
  if(t==='rem')drawRems();
  if(t==='team'){tm.det=null;loadTeam()}
  if(t==='home')try{render()}catch(e){}
  if(t==='menu')drawMenu();
  if(t==='close')drawClose();
  $('htitle').textContent=TT[t]||'CHILLO';$('hback').classList.toggle('hidden',t==='menu');$('hset').classList.toggle('hidden',t==='set');window.scrollTo(0,0);
}
function reset(){editId=null;$('amt').value='';$('note').value='';$('aerr').textContent='';$('date').value=ymd(new Date());$('save').textContent='Save sale'}

auth.onAuthStateChanged(async u=>{
  if(!u){show('login');return}
  uid=u.uid;
  try{const s=await userDoc().get();me=s.exists?s.data():null}catch(e){me=null}
  const any=me&&(me.role==='admin'||Object.values(me.perms||{}).some(Boolean));
  if(!me||me.active===false||!any){show('wait');return}
  me.areas=me.areas||[];
  show('app');$('who').textContent=(me.name||'').toUpperCase();$('hmail').textContent=u.email;$('sname').textContent=(me.name||'').toUpperCase();$('smail').textContent=u.email;start();
});

$('go').onclick=async()=>{
  $('lerr').textContent='';
  try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}
  catch(e){
    const bad=['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(e.code);
    $('lerr').textContent=(bad?'Wrong email or password.':'Sign-in problem.')+' ('+e.code+')';
  }
};
$('out').onclick=$('out2').onclick=()=>auth.signOut();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.t!=='add')reset();tab(b.dataset.t)});

function start(){
  const n=new Date(),a=ymd(new Date(n.getFullYear(),n.getMonth(),1)),b=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  unsub&&unsub();
  unsub=sales().where('date','>=',a).where('date','<=',b).orderBy('date','desc')
    .onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  reset();$('tg').value=me.target||'';fillAreas();applyAccess();tab('menu');loadClosed();if(me.role==='admin')watchMembers();if(can('prod.view')||can('stock.use')||can('load.setup'))watchProducts();if(can('cust.view'))watchCusts();if(can('rem.use'))watchRems();if(can('stock.use')||can('load.setup'))loadStock();
}

function render(){
  updMenu();
  if(!can('sales.report')){$('home').innerHTML='<p class="muted">No access to the monthly report.</p>';return}
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate();
  let work=0,done=0;
  for(let d=1;d<=dim;d++){ if(new Date(y,m,d).getDay()!==5){work++;if(d<=n.getDate())done++} } // Friday = holiday
  const left=work-done,elapsed=Math.max(done,1);
  const total=entries.reduce((s,e)=>s+e.amount,0),avg=total/elapsed,proj=avg*work;
  const target=me.target||0,pct=target?Math.round(total/target*100):0;
  const need=target&&left>0?Math.max(0,(target-total)/left):0;
  const byArea={};entries.forEach(e=>{const k=e.area||'No area';byArea[k]=(byArea[k]||0)+e.amount});
  $('home').innerHTML=
   `${dueHtml()}${overHtml()}<div class="muted">${n.toLocaleString('en',{month:'long',year:'numeric'})}</div>
    <div class="big">${fmt(total)} SAR</div>
    <div class="row"><span>Daily average</span><b>${fmt(avg)}</b></div>
    <div class="row"><span>Expected month-end</span><b>${fmt(proj)}</b></div>
    <div class="row"><span>Working days left</span><b>${left}</b></div>`+
   (target?`<div class="row"><span>Target ${fmt(target)}</span><b>${pct}%</b></div>
    <div class="bar"><i style="width:${Math.min(pct,100)}%"></i></div>
    <div class="muted">Need ${fmt(need)} per working day to reach it</div>`:'')+
   `<h3>By area</h3>`+(Object.keys(byArea).map(k=>`<div class="row"><span>${esc(k)}</span><b>${fmt(byArea[k])}</b></div>`).join('')||'<div class="muted">No sales yet this month.</div>')+
   `<h3>Entries</h3>`+entries.map(e=>`<div class="row"><i class="dot"></i><span style="flex:1">${e.date}<br><span class="muted">${esc(e.area||'No area')}${e.note?', '+esc(e.note):''}</span></span>
    <span><b>${fmt(e.amount)}</b>${closedSet.has(e.date)?'<span class="muted">Closed</span>':''}${can('sales.edit')&&!closedSet.has(e.date)?'<a data-e="'+e.id+'">Edit</a>':''}${can('sales.delete')&&!closedSet.has(e.date)?'<a data-d="'+e.id+'">Delete</a>':''}</span></div>`).join('');
}
$('home').onclick=ev=>{
  const t=ev.target,e=entries.find(x=>x.id===t.dataset.e);
  if(e){editId=e.id;$('date').value=e.date;$('amt').value=e.amount;$('area').value=e.area||'';$('note').value=e.note||'';$('save').textContent='Update sale';tab('add')}
  if(t.dataset.d&&confirm('Delete this sale entry?'))sales().doc(t.dataset.d).delete().catch(x=>alert(x.message));
};

$('save').onclick=()=>{
  const amount=parseFloat($('amt').value),date=$('date').value;
  if(!date||$('amt').value===''||!(amount>=0)){$('aerr').textContent='Enter the date and the amount.';return}
  if(closedSet.has(date)){$('aerr').textContent='This day is closed. Ask the admin to reopen it.';return}
  const data={date,amount,area:$('area').value,note:$('note').value.trim()};
  (editId?sales().doc(editId).update(data):sales().add({...data,ts:firebase.firestore.FieldValue.serverTimestamp()}))
    .catch(x=>alert('Could not save: '+x.message));
  reset();tab('home');
};

function fillAreas(){
  $('area').innerHTML=me.areas.length?me.areas.map(a=>`<option>${esc(a)}</option>`).join(''):'<option value="">Add areas in Settings</option>';
  $('arl').innerHTML=me.areas.map((a,i)=>`<div class="row"><span>${esc(a)}<br><span class="muted">${cs.filter(c=>c.area===a).length} customers</span></span><span><a data-au="${i}">&uarr;</a><a data-ad="${i}">&darr;</a><a data-ar="${i}">Rename</a><a data-r="${i}">Remove</a></span></div>`).join('')||'<div class="muted">No areas yet.</div>';
}
const saveAreas=()=>{userDoc().update({areas:me.areas}).catch(x=>alert(x.message));fillAreas()};
$('aa').onclick=()=>{const v=$('na').value.trim();if(v&&!me.areas.includes(v)){me.areas.push(v);$('na').value='';saveAreas()}};
$('arl').onclick=e=>{
  const d=e.target.dataset,A=me.areas;

async function addMember(){

    sec=firebase.initializeApp(CFG,'sec'+Date.now());

async function importFile(f){
  const msg=$('pmsg2');msg.textContent='Reading file...';
  try{
    const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    let ok=0,skip=0,n=0,batch=db.batch();
    for(const r of rows){
      const k={};Object.keys(r).forEach(h=>k[String(h).trim().toLowerCase()]=r[h]);
      const code=String(k.code||'').trim(),name=String(k.name||'').trim();
      if(!code||!name){skip++;continue}
      const pr=parseFloat(k.price!==undefined?k.price:k['price per carton']);
      batch.set(db.collection('products').doc(idOf(code)),{code,name,pack:String(k.pack||'').trim(),unit:String(k.unit||'Carton').trim(),category:String(k.category||'').trim(),price:isNaN(pr)?null:pr,...(String(k.barcode||'').trim()?{barcode:String(k.barcode).trim()}:{})},{merge:true});
      ok++;n++;
      if(n===400){await batch.commit();batch=db.batch();n=0}
    }
    if(n)await batch.commit();
    msg.textContent='Imported '+ok+' products'+(skip?', skipped '+skip+' rows without code or name':'')+'.';
  }catch(e){msg.textContent='Import failed: '+e.message}
}
function template(){
  const ws=XLSX.utils.aoa_to_sheet([['Code','Name','Pack','Unit','Category','Price per carton','Barcode'],['FG-ICE-0001','Example Vanilla Cups','1*30*40 GM','Carton','Cups',50,'6281000000000']]);

}

    const bar=$('pbar').value.replace(/\s+/g,''),dup=bar&&prods.find(x=>x.barcode===bar&&x.id!==(old&&old.id));

function parseLoc(t){
  t=String(t||'');const m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
  return m?{lat:+m[1],lng:+m[2]}:null;
}
function dist(c){
  if(!pos||c.lat==null)return null;const r=x=>x*Math.PI/180,dl=r(c.lat-pos.lat),dg=r(c.lng-pos.lng);
  const a=Math.sin(dl/2)**2+Math.cos(r(pos.lat))*Math.cos(r(c.lat))*Math.sin(dg/2)**2;return 6371*2*Math.asin(Math.sqrt(a));
}
function missed(c){
  if(c.type!=='fixed')return false;const t=new Date(),ws=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+1)%7));
  return (c.days||[]).some(dd=>{const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+(dd+1)%7);return ymd(d)<ymd(t)&&(c.lastVisit||'')<ymd(d)});
}
function isToday(c){
  return (c.type==='fixed'&&(c.days||[]).includes(new Date().getDay()))||(c.type==='call'&&c.calledAt&&c.calledAt>(c.lastVisit||''));

function resolveKey(k,pm){

  if(pm[k])return{key:k,how:'ok'};
  const c=Object.keys(pm).filter(x=>x.length===k.length&&x.slice(0,2)===k.slice(0,2)&&[...k].filter((ch,i)=>ch!==x[i]).length===1);

    const ny=i+1<R.length?R[i+1].y:1e9,cd=codes.find(c=>c.y>r.y+.3*lh&&c.y<=ny-.1*lh),ov=O.find(o=>Math.abs(o.y-r.y)<.3*lh);

async function readAndMatch(f,say){

function routeSort(m){

      while(rest.length){let bi=0,bd=1e9;rest.forEach((c,i)=>{const d=hav(cur,c);if(d<bd){bd=d;bi=i}});const n=rest.splice(bi,1)[0];out.push(n);cur=n}
      rt.list=out;drawRoute()};
    return pos?go(pos):getPos(go);
  }
  drawRoute();
}

function scanBarcode(cb){

  ov.innerHTML='<video playsinline muted style="width:100%;max-width:420px;border-radius:12px"></video><div style="color:#fff;font-size:14px" id="sm">Point the camera at the barcode</div><button class="alt" id="sx" style="max-width:420px">Cancel</button>';
  document.body.appendChild(ov);
  const v=ov.querySelector('video'),msg=t=>{ov.querySelector('#sm').textContent=t};let stop=false,stream=null,zr=null;
  const end=r=>{if(stop)return;stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());if(zr)try{zr.reset()}catch(e){}ov.remove();if(r)cb(r)};
  ov.querySelector('#sx').onclick=()=>end();
  const noCam=()=>msg('Camera not allowed. Allow camera access for this site, or type the number.');
  if('BarcodeDetector' in window){
    const det=new BarcodeDetector();
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{
      stream=s;v.srcObject=s;v.play();
      const tick=async()=>{if(stop)return;try{const r=await det.detect(v);if(r.length){end(r[0].rawValue);return}}catch(e){}setTimeout(tick,250)};tick();
    }).catch(noCam);

    zr=new ZXing.BrowserMultiFormatReader();

  }else msg('Scanning is not available on this browser. Type the number.');
}

function editPhoto(file,cb){
  const img=new Image(),W=320,H=240;
  img.onload=()=>{
    let rot=0,z=1,ox=0,oy=0,d0=0,z0=1;const pts=new Map();
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
    ov.innerHTML='<canvas width="320" height="240" style="touch-action:none;background:#000"></canvas><div style="color:#fff;font-size:14px">Drag to move, pinch or use the slider to zoom</div><input type="range" min="1" max="4" step="0.05" value="1" style="width:320px"><div style="display:flex;gap:8px;width:320px"><button class="alt" id="er">Rotate</button><button class="alt" id="ec">Cancel</button><button id="es">Use photo</button></div>';
    document.body.appendChild(ov);
    const cv=ov.querySelector('canvas'),sl=ov.querySelector('input'),ctx=cv.getContext('2d');
    const base=()=>{const w=rot%2?img.height:img.width,h=rot%2?img.width:img.height;return Math.max(W/w,H/h)};
    const draw=(c,k)=>{c.fillStyle='#000';c.fillRect(0,0,W*k,H*k);c.save();c.translate(W*k/2+ox*k,H*k/2+oy*k);c.rotate(rot*Math.PI/2);const sc=base()*z*k;c.scale(sc,sc);c.drawImage(img,-img.width/2,-img.height/2);c.restore()};
    const paint=()=>draw(ctx,1);paint();
    const dd=()=>{const[a,b]=[...pts.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
    sl.oninput=()=>{z=+sl.value;paint()};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){d0=dd();z0=z}};
    cv.onpointermove=e=>{
      if(!pts.has(e.pointerId))return;const q=pts.get(e.pointerId);
      if(pts.size===1){ox+=e.clientX-q[0];oy+=e.clientY-q[1]}
      pts.set(e.pointerId,[e.clientX,e.clientY]);
      if(pts.size===2){z=Math.min(4,Math.max(1,z0*dd()/d0));sl.value=z}
      paint();
    };
    cv.onpointerup=cv.onpointercancel=e=>pts.delete(e.pointerId);
    ov.querySelector('#er').onclick=()=>{rot=(rot+1)%4;paint()};
    ov.querySelector('#ec').onclick=()=>ov.remove();
    ov.querySelector('#es').onclick=()=>{const o=document.createElement('canvas');o.width=960;o.height=720;draw(o.getContext('2d'),3);ov.remove();cb(o.toDataURL('image/jpeg',0.72))};
  };
  img.src=URL.createObjectURL(file);
}

function parseStock(text){
  const rows=[],seen={};let cur=null;
  const fin=()=>{
    if(!cur)return;const m=cur.rest.match(/(\d{4})/)||cur.first.match(/-\s?(\d{4})\b/);if(!m)return;
    const key=(/FG[-\s]*SA/i.test(cur.first)?'SA':'ICE')+m[1];if(seen[key])return;seen[key]=1;
    const name=(cur.first.replace(/^FG[-\s]*(ICE|SA)?\s*/i,'')+' '+cur.rest.replace(/^\s*[A-Z]?\s*-?\s*\d{4}\s*/,'')).replace(/\s+/g,' ').trim();
    const cm=cur.rest.match(/^\s*([A-Z]?)\s*-?\s*(\d{4})/),pre=key.startsWith('SA')?'SA':'ICE';
    rows.push({key,code:'FG-'+pre+(pre==='SA'&&cm&&cm[1]?cm[1]:'')+'-'+m[1],name,orig:cur.orig,rem:cur.rem});
  };
  for(const l of text.split('\n').map(x=>x.trim()).filter(Boolean)){
    const m=l.match(/(\d{1,5}[.,]\d{3})\s+(\d{1,5}[.,]\d{3})\s*$/);
    if(m){fin();cur={first:l.slice(0,m.index).replace(/\bCarton\b/i,'').trim(),rest:'',orig:+m[1].replace(',','.'),rem:+m[2].replace(',','.')}}
    else if(cur)cur.rest+=' '+l;
  }
  fin();return rows;
}

function workDays(m){
  const [y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate(),n=new Date(),cur=n.getFullYear()===y&&n.getMonth()===mo-1,past=new Date(y,mo-1,1)<new Date(n.getFullYear(),n.getMonth(),1);
  let work=0,done=0;
  for(let d=1;d<=dim;d++)if(new Date(y,mo-1,d).getDay()!==5){work++;if(past||(cur&&d<=n.getDate()))done++}
  return{work,done:Math.max(done,1),cur};
}

function calcDue(l){
  let P=l.filter(e=>e.type==='payment').reduce((a,e)=>a+e.amount,0),due='';
  const cr=l.filter(e=>e.type==='credit').sort((a,b)=>(a.date+(a.ts||'')).localeCompare(b.date+(b.ts||'')));
  for(const c of cr){if(P>=c.amount-0.0001){P-=c.amount;continue}P=0;if(c.due&&(!due||c.due<due))due=c.due}
  return due;
}

function cmpRows(){
  const o=st.chk.find(x=>x.id===st.oid)||st.order,od={},nm={},cur={},name={};
  ((o&&o.rows)||[]).forEach(r=>{od[r.key]=r.qty;name[r.key]=r.name});
  ((st.night&&st.night.rows)||[]).forEach(r=>{nm[r.key]=r.rem;name[r.key]=name[r.key]||r.name});
  (st.mrows||[]).forEach(r=>{cur[r.key]=r.orig;name[r.key]=r.name||name[r.key]});
  const keys=new Set([...Object.keys(cur),...Object.keys(od).filter(k=>od[k]>0)]);
  return [...keys].map(k=>{const old=nm[k]||0,ord=od[k]||0,exp=r3(old+ord),c=cur[k]==null?0:cur[k];
    return{k,name:name[k]||k,old,ord,exp,cur:c,df:r3(c-exp),isNew:nm[k]==null,miss:cur[k]==null}});

function delCoin(a){const rows=document.querySelectorAll('#close .crow');if(rows.length>1)a.closest('.crow').remove();else a.closest('.crow').querySelector('[data-cn]').value='';upCount()}
function coinRowsData(){return[...document.querySelectorAll('#close .crow')].map(r=>({v:parseFloat(r.querySelector('[data-cv]').value),n:parseFloat(r.querySelector('[data-cn]').value)||0})).filter(r=>r.n>0)}
const DEN=[500,200,100,50,20,10,5,1];
const dayRef=d=>db.collection('days').doc(uid+'_'+d);
function loadClosed(){db.collection('days').where('uid','==',uid).where('closed','==',true).get().then(q=>{closedSet=new Set(q.docs.map(d=>d.data().date))}).catch(()=>{})}
function cnt(){
  let t=0;document.querySelectorAll('#close [data-dn]').forEach(x=>{const n=parseFloat(x.value)||0,v=n*x.dataset.dn;t+=v;const sb=document.querySelector('#close [data-sub="'+x.dataset.dn+'"]');if(sb)sb.textContent=money(v)});
  let ct=0;document.querySelectorAll('#close .crow').forEach(r=>{const v=(parseFloat(r.querySelector('[data-cn]').value)||0)*parseFloat(r.querySelector('[data-cv]').value);ct+=v;r.querySelector('[data-csub]').textContent=money(v)});
  const od=$('ccoinold');if(od)ct+=parseFloat(od.dataset.v)||0;const ce=$('ccoins');if(ce)ce.textContent=money(ct);t+=ct;return r3(t);
}
function upCount(){
  const bank=cl.closed?(cl.day.bank||0):(parseFloat($('cbank')&&$('cbank').value)||0);
  if(!cl.closed)cl.exp=r3(cl.base-bank);
  const c=cnt(),d=r3(c-cl.exp),e=$('cdif');$('ctot').textContent=money(c);if($('cexp'))$('cexp').textContent=money(cl.exp)+' SAR';
  e.textContent=d===0?'OK':d>0?'Over +'+money(d):'Short '+money(d);e.style.color=d===0?'#1E8E4E':'#C0392B';
  saveDraft();
}
const dKey=()=>'chillo_draft_'+uid+'_'+cl.date;
function saveDraft(){
  if(cl.closed)return;
  try{
    const dn={};document.querySelectorAll('#close [data-dn]').forEach(x=>{if(x.value)dn[x.dataset.dn]=x.value});
    const co=[...document.querySelectorAll('#close .crow')].map(r=>({v:r.querySelector('[data-cv]').value,n:r.querySelector('[data-cn]').value}));
    localStorage.setItem(dKey(),JSON.stringify({dn,co,bank:$('cbank')?$('cbank').value:''}));
  }catch(e){}
}
function restoreDraft(){
  if(cl.closed)return;
  try{
    const d=JSON.parse(localStorage.getItem(dKey())||'null');if(!d)return;
    document.querySelectorAll('#close [data-dn]').forEach(x=>{x.value=(d.dn&&d.dn[x.dataset.dn])||''});
    if(d.co&&d.co.length)$('coinrows').innerHTML=d.co.map(r=>coinRowHtml(r.v,r.n)).join('');
    if($('cbank'))$('cbank').value=d.bank||'';
  }catch(e){}
}
function clearDraft(){try{localStorage.removeItem(dKey())}catch(e){}}
async function drawClose(){
  const d=cl.date||(cl.date=ymd(new Date()));$('close').innerHTML='<p class="muted">Loading...</p>';
  let tot=0,day={};
  try{const q=await sales().where('date','==',d).get();q.docs.forEach(x=>tot+=x.data().amount)}catch(e){}
  try{const x=await dayRef(d).get();day=x.exists?x.data():{}}catch(e){}
  const cr=day.credit||0,py=day.pay||0,closed=!!day.closed,base=r3(tot-cr+py),exp=closed&&day.expected!=null?day.expected:base;
  Object.assign(cl,{tot,cr,py,exp,closed,day,base});
  const nt=day.notes||{},ln=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
  $('close').innerHTML=`<label>Date</label><input type="date" id="cdate" value="${d}"><h3>${closed?'Closed day':'Open day'}</h3>`+
   ln('Sales total',money(closed&&day.sales!=null?day.sales:tot)+' SAR')+ln('Credit given (not in sales)','- '+money(cr))+ln('Payments received','+ '+money(py))+
   `<div class="row"><span>Received by bank (SAR)</span><input id="cbank" type="number" inputmode="decimal" value="${closed?(day.bank||''):''}" ${closed?'disabled':''} style="width:110px;margin:0;padding:6px"></div><div class="row"><b>Expected cash</b><b id="cexp">${money(exp)} SAR</b></div><p class="muted">Credit you give and money received by bank are taken off the cash you should have. Payments you collect from customers are added.</p><h3>Cash count</h3>`+
   DEN.map(n=>`<div class="row"><span>${n} x</span><input data-dn="${n}" type="number" inputmode="numeric" min="0" value="${closed?(nt[n]||''):''}" ${closed?'disabled':''} style="width:90px;margin:0;padding:6px"><b data-sub="${n}">0</b></div>`).join('')+
   `<h3>Coins</h3><div id="coinrows">${closed?(nt.coinRows||[]).map(r=>coinRowHtml(r.v,r.n,true)).join(''):coinRowHtml(1,'')}</div>`+(closed?(!nt.coinRows&&nt.coins?`<div class="row"><span>Coins (older entry)</span><b id="ccoinold" data-v="${nt.coins}">${money(nt.coins)}</b></div>`:''):'<button id="cadd" class="alt">+ Add coin row</button>')+`<div class="row"><b>Coins total</b><b id="ccoins">0</b></div>`+
   `<div class="row"><b>Counted</b><b id="ctot">0</b></div><div class="row"><b>Difference</b><b id="cdif"></b></div><p></p>`+
   (closed?(me.role==='admin'?'<button id="creopen" class="alt">Reopen this day</button>':'<p class="muted">This day is closed. Only the admin can reopen it.</p>'):'<button id="cclose">Close day</button><button id="creset" class="alt">Reset count</button>')+
   '<button id="cshare2" class="alt">Share report</button>';
  restoreDraft();upCount();
}
function closeText(){
  if(!cl.closed)upCount();const bk=cl.closed?(cl.day.bank||0):(parseFloat($('cbank').value)||0),c=cnt(),d=r3(c-cl.exp),nt=[];document.querySelectorAll('#close [data-dn]').forEach(x=>{if(x.value)nt.push(x.dataset.dn+' x '+x.value)});
  coinRowsData().forEach(r=>nt.push(r.n+' x '+coinLbl(r.v)));
  return 'Closing report '+cl.date+(me.name?' - '+me.name:'')+'\nSales: '+money(cl.closed&&cl.day.sales!=null?cl.day.sales:cl.tot)+'\nCredit given (not in sales): -'+money(cl.cr)+'\nPayments received: +'+money(cl.py)+(bk>0?'\nReceived by bank: -'+money(bk):'')+'\nExpected cash: '+money(cl.exp)+'\nCounted cash: '+money(c)+'\nDifference: '+(d===0?'OK':(d>0?'Over +':'Short ')+money(d))+(nt.length?'\nNotes: '+nt.join(', '):'');
}
$('close').oninput=e=>{if(e.target.dataset.dn||e.target.dataset.cn!==undefined||e.target.id==='cbank')upCount()};
$('close').onchange=e=>{if(e.target.id==='cdate'){cl.date=e.target.value;drawClose()}else if(e.target.dataset.cv!==undefined)upCount()};
$('close').onclick=async e=>{
  const t=e.target;
  if(t.id==='cadd'){addCoin();return}
  if(t.dataset.cx!==undefined){delCoin(t);return}
  if(t.id==='cclose'){
    upCount();const c=cnt(),dif=r3(c-cl.exp);
    if(!confirm('Close '+cl.date+'?\nExpected '+money(cl.exp)+', counted '+money(c)+', difference '+money(dif)+'.\nSales for this day are locked after closing.'))return;
    const notes={};document.querySelectorAll('#close [data-dn]').forEach(x=>{if(x.value)notes[x.dataset.dn]=parseFloat(x.value)||0});const cr2=coinRowsData();if(cr2.length){notes.coinRows=cr2;notes.coins=r3(cr2.reduce((a,r)=>a+r.n*r.v,0))}
    try{await dayRef(cl.date).set({uid,date:cl.date,closed:true,closedAt:stamp(),sales:cl.tot,credit:cl.cr,pay:cl.py,expected:cl.exp,bank:parseFloat($('cbank').value)||0,counted:c,diff:dif,notes},{merge:true});closedSet.add(cl.date);clearDraft();drawClose()}
    catch(x){alert('Could not close: '+x.message)}
  }
  else if(t.id==='creopen'){if(confirm('Reopen this day?'))try{await dayRef(cl.date).update({closed:false,reopenedAt:stamp()});closedSet.delete(cl.date);drawClose()}catch(x){alert(x.message)}}
  else if(t.id==='creset'){if(confirm('Clear all counted notes, coins and the bank amount?')){clearDraft();drawClose()}}
  else if(t.id==='cshare2')shareText(closeText());
};
async function showMemberDays(){
  let l=[];try{const q=await db.collection('days').where('uid','==',openId).where('closed','==',true).get();l=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date))}catch(e){}
  $('mem').innerHTML='<a id="back" style="margin:0">Back to members</a><h2>Closed days</h2>'+(l.map(d=>`<div class="row"><span>${esc(d.date)}<br><span class="muted">Sales ${money(d.sales||0)}, counted ${money(d.counted||0)}, difference ${money(d.diff||0)}</span></span><a data-ro="${d.id}">Reopen</a></div>`).join('')||'<p class="muted">No closed days.</p>');
}
function reopenDay(id){if(confirm('Reopen this day? The salesperson can edit it again.'))db.collection('days').doc(id).update({closed:false,reopenedAt:stamp()}).then(showMemberDays).catch(e=>alert(e.message))}
let st={chk:[],opts:{dir:'down',hrs:12},unk:[],fix:{},mstep:1,v:'order',stage:'pick',cfg:{},doors:[],night:null,order:null,rows:null,html:''};
const stk=()=>userDoc().collection('stock');
async function loadStock(){
  try{const q=await userDoc().collection('loadcfg').get();q.docs.forEach(d=>{if(d.id==='_doors')st.doors=d.data().names;else if(d.id==='_opts')st.opts=d.data();else st.cfg[d.id]=d.data()})}catch(e){}
  if(!st.doors||st.doors.length!==8)st.doors=[1,2,3,4,5,6,7,8].map(i=>'Door '+i);
  try{const d=await stk().doc('night').get();st.night=d.exists?d.data():null}catch(e){}
  try{const d=await stk().doc('morning').get();st.morn=d.exists?d.data():null}catch(e){}
  await cleanOrders();
  try{const q=await db.collection('ocrfix').get();q.docs.forEach(d=>st.fix[d.id]=d.data().to)}catch(e){}
  try{const q=await chkCol().orderBy('ts','desc').limit(5).get();st.chk=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
  try{const d=await stk().doc('lastorder').get();st.order=d.exists?d.data():null}catch(e){}
  if(!st.chk.length&&st.order)st.chk=[{...st.order,id:'last'}];
  drawStock();
}
async function ocr(file,say){
  const img=await createImageBitmap(file),W=img.width,H=img.height,S=1500,O=120,txt=[];
  say('Loading the reader (needs internet the first time)...');
  const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_pageseg_mode:'6'});
  for(let y=0,i=1;y<H;y+=S-O,i++){
    const h=Math.min(S,H-y),c=document.createElement('canvas');c.width=W;c.height=h;const cx=c.getContext('2d');cx.drawImage(img,0,y,W,h,0,0,W,h);const id=cx.getImageData(0,0,W,h),a=id.data;for(let j=0;j<a.length;j+=4){const g=.3*a[j]+.59*a[j+1]+.11*a[j+2],v=g<125?0:255;a[j]=a[j+1]=a[j+2]=v}cx.putImageData(id,0,0);
    say('Reading part '+i+'...');txt.push((await w.recognize(c)).data.text);if(y+h>=H)break;
  }
  await w.terminate();return parseStock(txt.join('\n'));
}
const NOTE={order:'Upload the screenshot taken when about 90% of sales are done.',night:'Upload the screenshot after all sales are closed.',morning:'Upload the screenshot after loading is entered.'};
function drawStock(){
  $('stock').innerHTML=`<h2>Stock</h2><div class="pills">${[['order','Order'],['morning','Morning check'],['orders','Saved orders']].map(([v,t])=>`<button data-sv="${v}" class="${v===st.v?'on':''}">${t}</button>`).join('')}</div><div id="sb"></div>`;
  drawSB();
}
const whenTxt=t=>t?new Date(t).toLocaleString('en',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
function mReady(){return{a:!!st.night,m:st.morn&&(!st.night||(st.morn.ts||'')>(st.night.ts||''))?st.morn:null}}
function mCard(n,title,hint,data){
  return `<div class="mcard${data?' ok':''}"><b>${n}. ${title}</b><div class="muted">${hint}</div>`+(data?`<div class="mok">&#10003; ${data.rows.length} products read<br><span class="muted">${whenTxt(data.ts)}</span></div>`:'<div class="muted" style="margin:6px 0 8px">Not uploaded yet</div>')+`<button data-up="${n}" class="${data?'alt':''}">${data?'Change screenshot '+n:'Choose screenshot '+n}</button></div>`;
}
function drawCards(){
  const r=mReady();
  $('sb').innerHTML=mCard(1,'Old stock (night remaining)','Taken after sales closed.',st.night)+mCard(2,'Current stock (morning)','Taken after loading is entered, including new products.',r.m)+(r.a&&r.m?'<button id="mres">Show result</button>':'')+'<div class="muted" id="sst"></div>';
}
function afterMorning(){
  st.rows=null;st.mrows=null;const r=mReady();
  if(r.a&&r.m){st.mrows=r.m.rows;st.oid=(st.chk[0]&&st.chk[0].id)||'';st.only=false;st.stage='cmp'}else st.stage='pick';
  drawSB();
}
function drawSB(){
  const b=$('sb');
  if(st.v==='orders')return drawOrders();
  if(st.stage==='review')return drawReview();
  if(st.stage==='order')return drawOrder();
  if(st.stage==='cmp')return drawCompare();
  if(st.v==='morning'&&st.stage==='pick')return drawCards();
  if(st.stage==='done'){b.innerHTML=st.html+'<button id="sagain" class="alt">Start again</button>';return}
  b.innerHTML=`<p class="muted">${st.v==='morning'?(st.mstep===2?'Screenshot 2 of 2: the morning stock after loading is entered (including any new products).':'Screenshot 1 of 2: the night remaining stock, taken after sales closed.'):NOTE[st.v]}</p><button id="sup">Choose screenshot</button><div class="muted" id="sst"></div>`;
}
function drawOrder(){
  const has=r=>st.cfg[r.key]&&st.cfg[r.key].max>0,rows=st.rows.filter(has),rest=st.rows.filter(r=>!has(r)).sort((a,b)=>a.name.localeCompare(b.name));
  rows.sort((a,b)=>(st.cfg[a.key].door??9)-(st.cfg[b.key].door??9));
  let last=null,h='';
  const grp=t=>{if(last!==null)h+='</div>';h+=`<div class="og"><h3>${esc(t)}</h3>`;last=t};
  rows.forEach(r=>{const c=st.cfg[r.key],d=c.door===''||c.door==null?'No door':st.doors[c.door];
    if(d!==last)grp(d);
    h+=`<div class="row orow"><span>${esc(r.name)}<br><span class="muted">Remaining ${r.rem}${adjTag(r)}, max ${c.max}${c.step?', round '+c.step:''}</span></span><input data-o="${r.key}" data-n="${esc(r.name)}" data-d="${esc(d)}" type="number" step="any" value="${calcNeed(r.rem,c)}" data-rem="${r.rem}" style="width:80px;margin:0"></div>`});
  if(rest.length){grp('No max set');rest.forEach(r=>{h+=`<div class="row orow"><span>${esc(r.name)}<br><span class="muted">Remaining ${r.rem}${adjTag(r)}, no max set</span></span><input data-o="${r.key}" data-n="${esc(r.name)}" data-d="No max set" type="number" step="any" value="0" data-rem="${r.rem}" style="width:80px;margin:0"></div>`})}
  if(last!==null)h+='</div>';
  $('sb').innerHTML=`<label>Order type</label><select id="omode">${modeOpts(eff().mode)}</select><label>Round to multiples of (0 = none)</label><input id="omult" type="number" value="${eff().mult||''}" placeholder="for example 5"><p class="muted" id="oex">${exLine()}</p><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ozero" ${st.hz?'checked':''}> Hide products with zero quantity</label><p class="muted">Order = max load minus remaining. Change any quantity you want.${rest.length?' '+rest.length+' products have no max set. They are listed at the bottom with quantity 0, and you can type a quantity or set their max in Load setup.':''}</p>${h||'<p>No products were found in the screenshot.</p>'}<p></p><button id="osave">Save order</button><button id="orb" class="alt">Rebuild automatically</button><button id="oshare" class="alt">Share on WhatsApp</button>`;
  applyZero();
}
function applyZero(){
  const hz=st.hz;document.querySelectorAll('#sb .orow').forEach(r=>{const v=parseFloat(r.querySelector('[data-o]').value)||0;r.classList.toggle('hidden',!!hz&&v===0)});
  document.querySelectorAll('#sb .og').forEach(g=>g.classList.toggle('hidden',!g.querySelector('.orow:not(.hidden)')));
}
function compare(m){
  const nm={},od={};((st.night&&st.night.rows)||[]).forEach(r=>nm[r.key]=r);((st.order&&st.order.rows)||[]).forEach(r=>od[r.key]=r.qty);
  let ok=0,bad=0;
  const h=m.map(r=>{const n=nm[r.key],ld=r.orig-(n?n.rem:0),o=od[r.key]||0,df=ld-o,good=Math.abs(df)<0.0005;good?ok++:bad++;
    return `<div class="row"><span>${esc(r.name)}<br><span class="muted">Ordered ${o}, loaded ${ld}${n?'':' (new product)'}</span></span><b style="color:${good?'#1E8E4E':'#C0392B'}">${good?'OK':df>0?'Excess +'+df:'Short '+df}</b></div>`}).join('');
  return `<h3>${ok} OK, ${bad} to check</h3>`+h;
}
function pickShot(){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;
    try{await readAndMatch(f,t=>{$('sst').textContent=t});
      if(!st.rows.length&&!st.unk.length){$('sst').textContent='Could not read any products. Try a clearer, full-width screenshot.';return}
      st.stage='review';drawSB()}catch(e){$('sst').textContent='Reading failed: '+e.message}};
  i.click();
}
$('stock').onclick=ev=>{
  const t=ev.target;
  ordActions(t,uid,drawOrders);
  if(t.id==='orb')rebuild();
  else if(t.dataset.sv){st.v=t.dataset.sv;st.stage='pick';st.rows=null;st.mstep=1;drawStock();return}
  if(t.id==='sup')pickShot();
  else if(t.dataset.up){st.mstep=+t.dataset.up;pickShot()}
  else if(t.id==='mres')afterMorning();
  else if(t.id==='sagain'){st.stage='pick';st.rows=null;st.mstep=1;drawSB()}
  else if(t.id==='cshare')shareCompare();
  else if(t.id==='sok'){
    if(!collectRows())return;
    st.rows.forEach(applyAdj);
    const d={date:ymd(new Date()),rows:st.rows,ts:new Date().toISOString()};
    if(st.v==='order'){stk().doc('evening').set(d).catch(()=>{});st.ov=null;st.stage='order';drawSB()}
    else if(st.v==='night'){stk().doc('night').set(d).catch(e=>alert(e.message));st.night=d;st.html='<p>Night stock saved ('+d.rows.length+' products). Use Load setup to set max loads.</p>';st.stage='done';drawSB()}
    else if(st.mstep===1){stk().doc('night').set(d).catch(()=>{});st.night=d;afterMorning()}
    else{stk().doc('morning').set(d).catch(()=>{});st.morn=d;afterMorning()}
  }
  else if(t.id==='osave'||t.id==='oshare'){
    const rows=[...document.querySelectorAll('#sb [data-o]')].map(x=>({key:x.dataset.o,name:x.dataset.n,door:x.dataset.d,qty:parseFloat(x.value)||0}));
    if(t.id==='osave'){st.order={date:ymd(new Date()),rows};st.order.ts=stamp();const ref=ordersCol(uid).doc();ref.set(st.order).catch(e=>alert(e.message));chkCol().doc(ref.id).set(st.order).catch(()=>{});st.order.id=ref.id;st.chk.unshift(st.order);pruneChk();stk().doc('lastorder').set(st.order).catch(()=>{});st.html='<p>Order saved. Use Morning check after loading.</p>';st.stage='done';drawSB()}
    else shareText(orderText(rows,ymd(new Date())))
  }
};
$('stock').onchange=ev=>{const i=ev.target.id;
  if(i==='sv'){st.v=ev.target.value;st.stage='pick';st.rows=null;st.mstep=1;drawSB()}
  else if(i==='ochk'){st.oid=ev.target.value;drawCompare()}
  else if(i==='oonly'){st.only=ev.target.checked;drawCompare()}
  else if(i==='ozero'){st.hz=ev.target.checked;applyZero()}
  else if(i==='omode'||i==='omult'){st.ov={mode:$('omode').value,mult:parseFloat($('omult').value)||0};rebuild();$('oex').textContent=exLine()}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
